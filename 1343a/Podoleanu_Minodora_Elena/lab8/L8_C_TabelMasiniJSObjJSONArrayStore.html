<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Tabel Masini - Tablou JSON in Local Storage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 25px; }
        table { border-collapse: collapse; margin-top: 15px; width: 60%; }
        th, td { border: 1px solid #444; padding: 8px; text-align: left; }
        th { background-color: #6a1b9a; color: white; }
        input, button { padding: 6px; margin: 3px; }
        #mesaj { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Mașini (Local Storage – tablou JSON sub cheia carsArray)</h2>

    <form onsubmit="return adaugaMasina()">
        <input id="marca" placeholder="Marca" required>
        <input id="model" placeholder="Model" required>
        <input id="culoare" placeholder="Culoare" required>
        <input id="anFab" type="number" placeholder="An fabricatie" required>
        <button type="submit">Adauga masina</button>
    </form>

    <p id="mesaj"></p>

    <table id="tm">
        <tr>
            <th>Marca</th>
            <th>Model</th>
            <th>Culoare</th>
            <th>An fabricatie</th>
        </tr>
    </table>

    <script>
        function masina(mk, md, cl, an) {
            this.marca = mk;
            this.model = md;
            this.culoare = cl;
            this.anFab = an;
            this.randNou = function() {
                return "<tr><td>" + this.marca + "</td><td>" + this.model +
                       "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
            };
        }

        function valideaza(marca, model, culoare, an) {
            if (marca.trim() === "") return "Eroare: Marca nu poate fi goală sau formată doar din spații.";
            if (model.trim() === "") return "Eroare: Modelul nu poate fi gol sau format doar din spații.";
            if (culoare.trim() === "") return "Eroare: Culoarea nu poate fi goală sau formată doar din spații.";

            var anNum = Number(an);
            var anCurent = new Date().getFullYear();
            if (!Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
                return "Eroare: Anul fabricației trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
            }
            return "";
        }

        var m1 = new masina("Opel", "Zafira", "gri", 2015);
        var m2 = new masina("Seat", "Ibiza", "roz", 2018);
        document.getElementById("tm").innerHTML += m1.randNou();
        document.getElementById("tm").innerHTML += m2.randNou();

        var masini2Store = [];

        if (localStorage.carsArray) {
            masini2Store = JSON.parse(localStorage.carsArray);
            for (var i = 0; i < masini2Store.length; i++) {
                if (masini2Store[i].anFab !== undefined) {
                    document.getElementById("tm").innerHTML += masini2Store[i].randNou;
                }
            }
        }

        function adaugaMasina() {
            var marca = document.getElementById("marca").value;
            var model = document.getElementById("model").value;
            var culoare = document.getElementById("culoare").value;
            var an = document.getElementById("anFab").value;

            var eroare = valideaza(marca, model, culoare, an);
            document.getElementById("mesaj").innerHTML = eroare;
            if (eroare !== "") {
                return false;
            }

            var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
            document.getElementById("tm").innerHTML += mNoua.randNou();

            mNoua.randNou = mNoua.randNou().toString();
            masini2Store.push(mNoua);
            localStorage.setItem("carsArray", JSON.stringify(masini2Store));

            document.querySelector("form").reset();
            return false;
        }
    </script>

<!--
Explicații Exercițiul 6 (noutăți față de L8_B):
1. Tabloul masini2Store: În loc să rețină un singur obiect, codul folosește un array în memorie în care adaugă fiecare mașină nouă 
cu metoda .push(), fără a le șterge pe cele anterioare.
2. Cheia carsArray: Întregul tablou de obiecte este serializat ca un singur text JSON și salvat în Local Storage sub 
cheia "carsArray".
3. Bucla de la încărcare: La deschiderea paginii, tabloul este parcurs cu o buclă for de la 0 la masini2Store.length - 1,
 astfel încât toate mașinile salvate sunt reafişate în tabel, în ordinea exactă în care au fost adăugate.
-->

</body>
</html>
