
<!DOCTYPE html>
<html>
<head>
<title>Tabel masini JSON</title>
<style>
table {
    font-family: arial, sans-serif;
    border-collapse: collapse;
    width: 100%;
}

td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
}
</style>
</head>
<body>

<h1>Masinile dorite</h1>

<input id="marca" placeholder="Marca">
<input id="model" placeholder="Model">
<input id="culoare" placeholder="Culoare">
<input id="anFab" type="number" placeholder="An fabricatie">

<button onclick="adaugaMasina()">Adauga masina</button>

<p id="mesaj"></p>

<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
</tr>
</table>

<script>

function masina(mk, md, cl, an) {
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;

    this.randNou = function() {
        return "<tr><td>" + this.marca +
        "</td><td>" + this.model +
        "</td><td>" + this.culoare +
        "</td><td>" + this.anFab + "</td></tr>";
    };
}

function valideaza(marca, model, culoare, an) {
    var anCurent = new Date().getFullYear();

    if (marca.trim() === "") {
        return "Marca nu poate fi goala!";
    }

    if (model.trim() === "") {
        return "Modelul nu poate fi gol!";
    }

    if (culoare.trim() === "") {
        return "Culoarea nu poate fi goala!";
    }

    if (an.trim() === "" || !/^\d+$/.test(an) ||
        Number(an) < 1900 || Number(an) > anCurent) {
        return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";
    }

    return "";
}

var nrMasini = 0;

for (var i = 0; i < localStorage.length; i++) {
    var cheie = localStorage.key(i);

    if (cheie.startsWith("masina")) {
        var date = JSON.parse(localStorage.getItem(cheie));

        var mNoua = new masina(
            date.marca,
            date.model,
            date.culoare,
            date.anFab
        );

        document.getElementById("tm").innerHTML += mNoua.randNou();

        nrMasini++;
    }
}

function adaugaMasina() {
    var marca = document.getElementById("marca").value;
    var model = document.getElementById("model").value;
    var culoare = document.getElementById("culoare").value;
    var an = document.getElementById("anFab").value;

    var mesaj = valideaza(marca, model, culoare, an);

    document.getElementById("mesaj").innerHTML = mesaj;

    if (mesaj !== "") {
        return false;
    }

    marca = marca.trim();
    model = model.trim();
    culoare = culoare.trim();

    var mNoua = new masina(marca, model, culoare, an);

    mNoua.randNou = mNoua.randNou().toString();

    nrMasini++;

    localStorage.setItem("masina" + nrMasini, JSON.stringify(mNoua));

    document.getElementById("tm").innerHTML += mNoua.randNou;

    document.getElementById("mesaj").innerHTML = "";

    return false;
}

</script>

</body>
</html>

    sub forma unui obiect JSON: marca, model, culoare,
    anFab si randNou.

2. Linia mNoua.randNou = mNoua.randNou().toString();
    inlocuieste metoda randNou cu rezultatul ei, adica
    un text HTML care contine randul tabelului.
    Este necesara deoarece JSON.stringify nu poate salva

    deoarece randNou este deja un text HTML salvat,
    nu o functie care trebuie apelata.

    salvate in localStorage, nu doar ultima masina.
    Spre deosebire de L8_A, unde se salveaza doar ultima
    masina adaugata, in L8_B se pot pastra mai multe
