<!DOCTYPE html>
<html>
<head>
    <title>Tabel masini</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1> Masinile dorite </h1>

    <form onsubmit="return valideaza_masina();">
        <input id="marca" placeholder="Marca" required>
        <input id="model" placeholder="Model" required>
        <input id="culoare" placeholder="Culoare" required>
        <input id="anFab" type="number" placeholder="An fabricatie" required>
        <button type="submit">Adauga masina</button>
    </form>

    <p id="mesaj">
        <table id="tm">
            <tr>
                <th>Marca</th>
                <th>Model</th>
                <th>Culoare</th>
                <th>An fabricatie</th>
            </tr>

        </table>
    </p>
    <script>
        var m1 = new masina("Opel", "Zafira", "gri",2010);
        var m2 = new masina("Seat", "Ibiza", "roz",2015);

        document.getElementById("tm").innerHTML += m1.randNou();
        document.getElementById("tm").innerHTML +=  m2.randNou();

        if(localStorage.masinaN) {
        var masinaJSON = localStorage.masinaN;
        var mNoua = JSON.parse(masinaJSON);
        document.getElementById("tm").innerHTML += mNoua.randNou; // proprietate
        }

        function masina(mk, md, cl, an){
        this.marca= mk;
        this.model = md;
        this.culoare = cl;
        this.anFabricatie = an;
        this.randNou = function() {return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFabricatie + "</td></tr>"}
        }

        function adaugaMasina() {
        var marca= document.getElementById("marca").value;
        var model= document.getElementById("model").value;
        var culoare= document.getElementById("culoare").value;
        var anFab= document.getElementById("anFab").value;
        var mNoua = new masina(marca, model, culoare, anFab);

        document.getElementById("tm").innerHTML +=  mNoua.randNou();

        mNoua.randNou = mNoua.randNou().toString();
        var myJSON = JSON.stringify(mNoua);
        localStorage.setItem("masinaN", myJSON);
        }

        function valideaza_masina() {
        var marca = document.getElementById("marca").value;
        var model = document.getElementById("model").value;
        var culoare = document.getElementById("culoare").value;
        var anFab = parseInt(document.getElementById("anFab").value);
        var anCurent = new Date().getFullYear();
        if (marca === "" || model === "" || culoare === "") {
        document.getElementById("mesaj").innerText = "Marca, modelul si culoarea nu pot fi goale.";
        return false;
        }
        if (isNaN(anFab) || anFab < 1900 || anFab > anCurent) {
        document.getElementById("mesaj").innerText = "Anul de fabricatie trebuie sa fie intre 1900 si " + anCurent + ".";
        return false;
        }
        // Daca datele sunt corecte, se adauga masina si se salveaza in localStorage
        var mNoua = new masina(marca, model, culoare, anFab);
        document.getElementById("tm").innerHTML += mNoua.randNou();

        // Salvarea datelor in localStorage
        localStorage.setItem("marca", marca);
        localStorage.setItem("model", model);
        localStorage.setItem("culoare", culoare);
        localStorage.setItem("anFab", anFab);

        document.getElementById("mesaj").innerText = "";

        return false; // Prevenim trimiterea formularului
        }

        // afisare masini in tabelul creat in HTML cu datele introduse in formular
        function afisareMasini() {
        var marca = localStorage.getItem("marca");
        var model = localStorage.getItem("model");
        var culoare = localStorage.getItem("culoare");
        var anFab = localStorage.getItem("anFab");
        if (marca && model && culoare && anFab) {
        var mNoua = new masina(marca, model, culoare, anFab);
        document.getElementById("tm").innerHTML += mNoua.randNou();
        }
        }

    </script>
</body>
</html>

<!--
    (a) ce conține cheia masinaN după adăugarea unei mașini;
    (b) de ce, înainte de JSON.stringify, linia mNoua.randNou =
mNoua.randNou().toString(); înlocuiește metoda cu un text – ce s-ar întâmpla fără ea;
    (c) de ce la reîncărcare se scrie mNoua.randNou, fără paranteze;
    (d) câte mașini adăugate apar după reîncărcare, comparativ cu L8_A.
-->

Raspunsuri:
    (a): cheia masinaN conține un șir JSON care reprezintă obiectul mNoua, incluzând proprietățile marca, model, culoare și randNou (care a fost convertită într-un șir de caractere).
    (b): fără această linie, metoda randNou ar fi fost convertită într-un șir de caractere, ceea ce ar fi permis salvarea ei în localStorage.
    (c): la reîncărcare, mNoua.randNou este un șir de caractere, nu o funcție, deci nu are nevoie de paranteze.
    (d): după reîncărcare, apar toate mașinile adăugate anterior, comparativ cu L8_A.
