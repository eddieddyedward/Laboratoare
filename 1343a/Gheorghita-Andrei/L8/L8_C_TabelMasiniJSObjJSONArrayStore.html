<!DOCTYPE html>
<html>
<head>
    <title>Tabel masini</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1> Masinile dorite </h1>

    <form onsubmit="return valideaza_masina();">
        <input id="marca" placeholder="Marca" required>
        <input id="model" placeholder="Model" required>
        <input id="culoare" placeholder="Culoare" required>
        <input id="anFab" type="number" placeholder="An fabricatie" required>
        <button type="submit">Adauga masina</button>
    </form>

    <p id="mesaj">
        <table id="tm">
            <tr>
                <th>Marca</th>
                <th>Model</th>
                <th>Culoare</th>
                <th>An fabricatie</th>
            </tr>

        </table>
    </p>
    <script>
        const masini2Store = [];
        if(localStorage.carsArray) {
        let arrayJSON = localStorage.carsArray;
        var masiniStored = JSON.parse(arrayJSON);
        for(i=0; i < masiniStored.length ; i++){
        document.getElementById("tm").innerHTML += masiniStored[i].randNou(); // proprietate
        masini2Store.push(masiniStored[i]);
        }
        }

        function masina(mk, md, cl, anFab){
        this.marca= mk;
        this.model = md;
        this.culoare = cl;
        this.anFab = anFab;
        this.randNou = function() {return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>"};
        }

        function adaugaMasina() {
        var marca= document.getElementById("marca").value;
        var model= document.getElementById("model").value;
        var culoare= document.getElementById("culoare").value;
        var anFab= document.getElementById("anFab").value;
        var mNoua = new masina(marca, model, culoare, anFab);
        document.getElementById("tm").innerHTML +=  mNoua.randNou();

        mNoua.randNou = 	mNoua.randNou().toString();
        masini2Store.push(mNoua);
        var myJSON = JSON.stringify(masini2Store);
        localStorage.setItem("carsArray", myJSON);
        }

        function valideaza_masina() {
        var marca = document.getElementById("marca").value.trim();
        var model = document.getElementById("model").value.trim();
        var culoare = document.getElementById("culoare").value.trim();
        var anFab = document.getElementById("anFab").value.trim();
        var anCurent = new Date().getFullYear();
        if (marca === "" || model === "" || culoare === "") {
        document.getElementById("mesaj").innerText = "Marca, modelul si culoarea nu pot fi goale.";
        return false;
        }
        if (isNaN(anFab) || anFab < 1900 || anFab > anCurent) {
        document.getElementById("mesaj").innerText = "Anul de fabricatie trebuie sa fie intre 1900 si " + anCurent + ".";
        return false;
        }
        // Daca datele sunt corecte, masina se adauga in tabel si in localStorage, iar mesajul dispare
        document.getElementById("mesaj").innerText = "";
        adaugaMasina();
        return false;
        }

        // afisare masini in tabelul creat in HTML cu datele introduse in formular
        function afisareMasini() {
        var arrayJSON = localStorage.carsArray;
        if(arrayJSON) {
        var masiniStored = JSON.parse(arrayJSON);
        for(i=0; i < masiniStored.length ; i++){
        document.getElementById("tm").innerHTML += masiniStored[i].randNou; // proprietate
        }
        }
        }

    </script>
</body>
</html>

<!--
Q: Ce aduce nou aceasta filă față de L8_B (tabloul masini2Store, cheia carsArray, bucla de la încărcare)
A: Această filă, in comparatie cu L8_B, introduce un array (masini2Store) pentru a stoca mai multe obiecte de tip masina. 
   Cheia "carsArray" este folosită pentru a salva acest array în localStorage, permițând astfel stocarea și recuperarea mai multor mașini. 
   De asemenea, există o buclă la încărcare care parcurge array-ul stocat și afișează fiecare mașină în tabelul HTML, ceea ce permite vizualizarea tuturor mașinilor adăugate anterior.
-->
