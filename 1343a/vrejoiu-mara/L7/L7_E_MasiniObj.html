<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Masini - abordare cu folosirea de obiecte</title>
<script>

function loadMjs(){
var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
document.getElementById("mjs").innerHTML = 
"<ul>"+
"<li>Tip: " + mJS.tip +"</li>" +
"<li>Model: "  + mJS.model +"</li>" +
"<li>Culoare: "  + mJS.culoare + "</li>" +
"<li>An fabricatie: "  + mJS.anFab + "</li>" +
"</ul>";
}

function afiseaza(storage, id){
    if(storage.masina)
	{
        var masinaObj = JSON.parse(storage.masina);
        document.getElementById(id).innerHTML = 
        "<ul>"+
        "<li>Tip: " + masinaObj.tip +"</li>" +
        "<li>Model: " + masinaObj.model +"</li>" +
        "<li>Culoare: " + masinaObj.culoare + "</li>" +
        "<li>An fabricatie: " + masinaObj.anFab + "</li>" +
        "</ul>";
    }
	else
	{
    	document.getElementById(id).innerHTML = "<p>Nicio mașină salvată</p>";
    }
}

function salveazaMls(){
    var masinaL = {
        tip: document.getElementById("tipL").value,
        model: document.getElementById("modelL").value,
        culoare: document.getElementById("culoareL").value,
        anFab: document.getElementById("anFabL").value
    };
    localStorage.setItem("masina", JSON.stringify(masinaL));
    afiseaza(localStorage, "mls");
    return false;
}

function salveazaMss(){
    var masinaS = {
        tip: document.getElementById("tipS").value,
        model: document.getElementById("modelS").value,
        culoare: document.getElementById("culoareS").value,
        anFab: document.getElementById("anFabS").value
    };
    sessionStorage.setItem("masina", JSON.stringify(masinaS));
    afiseaza(sessionStorage, "mss");
    return false;
}

function sterge(storage, id, prefix){
    storage.removeItem("masina");
    document.getElementById("tip" + prefix).value = "";
    document.getElementById("model" + prefix).value = "";
    document.getElementById("culoare" + prefix).value = "";
    document.getElementById("anFab" + prefix).value = "";
    afiseaza(storage, id);
}

function init(){
    afiseaza(localStorage, "mls");
    afiseaza(sessionStorage, "mss");
}
</script>
</head>
<body onload="init()">

<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
    <p>Masina JavaScript</p>
    <div id="mjs"></div>
</div>

<div style="background-color:ForestGreen;color:white;font-size:200%">
    <p>Masina Local Storage</p>
    <form onsubmit="return salveazaMls()">
        <label for="tipL">Tip</label> <input id="tipL" required><br>
        <label for="modelL">Model</label> <input id="modelL" required><br>
        <label for="culoareL">Culoare</label> <input id="culoareL" required><br>
        <label for="anFabL">An fabricație</label> <input id="anFabL" required><br>
        <button type="submit">Salvează</button>
        <button type="button" onclick="sterge(localStorage, 'mls', 'L')">Șterge</button>
    </form>
    <div id="mls"></div>
</div>

<div style="background-color:SeaGreen;color:white;font-size:200%">
    <p>Masina Session Storage</p>
    <form onsubmit="return salveazaMss()">
        <label for="tipS">Tip</label> <input id="tipS" required><br>
        <label for="modelS">Model</label> <input id="modelS" required><br>
        <label for="culoareS">Culoare</label> <input id="culoareS" required><br>
        <label for="anFabS">An fabricație</label> <input id="anFabS" required><br>
        <button type="submit">Salvează</button>
        <button type="button" onclick="sterge(sessionStorage, 'mss', 'S')">Șterge</button>
    </form>
    <div id="mss"></div>
</div>
</body>
</html>
