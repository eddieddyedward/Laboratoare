
<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}
td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
#mesaj { color: red; }
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form id="formMasina" onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th> <th>Model</th> <th>Culoare</th> <th>An fabricatie</th>
  </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);
document.getElementById("tm").innerHTML += m1.randNou();
document.getElementById("tm").innerHTML += m2.randNou();

if (localStorage.masinaN) {
  var masinaJSON = localStorage.masinaN;
  var mNoua = JSON.parse(masinaJSON);
  document.getElementById("tm").innerHTML += mNoua.randNou; // proprietate (string), nu metoda
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model +
           "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  var anCurent = new Date().getFullYear();
  if (marca === "")   return "Marca nu poate fi goala sau formata doar din spatii.";
  if (model === "")   return "Modelul nu poate fi gol sau format doar din spatii.";
  if (culoare === "") return "Culoarea nu poate fi goala sau formata doar din spatii.";
  if (!Number.isInteger(an) || an < 1900 || an > anCurent)
    return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
  return "";
}

function adaugaMasina() {
  var marca   = document.getElementById("marca").value.trim();
  var model   = document.getElementById("model").value.trim();
  var culoare = document.getElementById("culoare").value.trim();
  var an      = Number(document.getElementById("anFab").value);

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerHTML = eroare;
    return false;
  }
  document.getElementById("mesaj").innerHTML = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou();

  mNoua.randNou = mNoua.randNou().toString();   // metoda -> text, ca sa ajunga in JSON
  var myJSON = JSON.stringify(mNoua);
  localStorage.setItem("masinaN", myJSON);

  document.getElementById("formMasina").reset();
  return false;
}
</script>
</body>
</html>


 <!--
Ex. 4
(a) Dupa adaugarea unei masini, cheia masinaN contine textul JSON al obiectului, de forma:
    {"marca":"Dacia","model":"Logan","culoare":"alb",
     "randNou":"<tr><td>Dacia</td><td>Logan</td><td>alb</td></tr>"}
    Adica proprietatile masinii plus randNou, care acum e un text (rândul de tabel gata construit), nu o functie.

(b) JSON.stringify omite functiile. Daca randNou ar ramane metoda, ea nu ar aparea deloc in JSON,
    iar la reincarcare mNoua.randNou ar fi undefined, deci in tabel s-ar adauga textul "undefined"
    in loc de rand. De aceea metoda se apeleaza inainte de salvare (mNoua.randNou()) si rezultatul,
    un string cu HTML-ul randului, se pune in locul ei. (.toString() e de fapt redundant, pentru ca
    randNou() intoarce deja un string.)

(c) JSON.parse intoarce un obiect simplu, fara metodele tipului masina. In el, randNou este o
    proprietate de tip string, nu o functie. Daca am scrie mNoua.randNou(), am primi eroarea
    "TypeError: mNoua.randNou is not a function". De aceea se citeste ca proprietate, fara paranteze.

(d) Dupa reincarcare apare tot o singura masina adaugata (ultima), la fel ca in L8_A, pentru ca
    fiecare adaugare suprascrie cheia masinaN. Diferenta fata de L8_A e ca acum masina se salveaza
    intr-o singura cheie (un obiect JSON), nu in trei chei separate.
-->
