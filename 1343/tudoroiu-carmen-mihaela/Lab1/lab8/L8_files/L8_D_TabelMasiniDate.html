<!DOCTYPE html>
<html>
<head>
<title>Tabel masini - L8_D</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  margin-top: 20px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}

button {
  margin-right: 5px;
}
</style>
</head>
<body>
<h1>Masinile dorite (L8_D)</h1>

<form onsubmit="return adaugaMasina()">
   <input id="marca" placeholder="Marca" required> 
   <input id="model" placeholder="Model" required> 
   <input id="culoare" placeholder="Culoare" required> 
   <input id="anFab" type="number" placeholder="An fabricatie" required> 
   <button type="submit">Adauga masina</button> 
   <button type="button" onclick="stergeTot()">Sterge toate</button>
</form> 
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<p style="margin-top: 30px;"><a href="index.html">Înapoi la Index Lab 8</a></p>

<script>
const masini2Store = [];

function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
}

masina.prototype.randNou = function() {
  return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
};

if(localStorage.carsArrayDate) {
  let arrayJSON = localStorage.carsArrayDate;
  let masiniStored = JSON.parse(arrayJSON);
  
  masini2Store.length = 0; 

  for(let i = 0; i < masiniStored.length; i++){
    let mObj = new masina(masiniStored[i].marca, masiniStored[i].model, masiniStored[i].culoare, masiniStored[i].anFab);
    masini2Store.push(mObj);
  }
}

afiseazaTabel();

function afiseazaTabel() {
  let tabelHtml = `<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>`;
  
  for(let i = 0; i < masini2Store.length; i++) {
    tabelHtml += masini2Store[i].randNou();
  }
  document.getElementById("tm").innerHTML = tabelHtml;
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "") return "Marca nu poate fi goală.";
  if (model.trim() === "") return "Modelul nu poate fi gol.";
  if (culoare.trim() === "") return "Culoarea nu poate fi goală.";

  let anInt = Number(an);
  let anCurent = new Date().getFullYear();
  if (isNaN(anInt) || !Number.isInteger(anInt) || anInt < 1900 || anInt > anCurent) {
    return "Anul fabricației trebuie să fie între 1900 și " + anCurent + ".";
  }
  return "";
}

function adaugaMasina() {
  let marca = document.getElementById("marca").value;
  let model = document.getElementById("model").value;
  let culoare = document.getElementById("culoare").value;
  let an = document.getElementById("anFab").value;

  let eroare = valideaza(marca, model, culoare, an);
  let pMesaj = document.getElementById("mesaj");

  if (eroare !== "") {
    pMesaj.innerText = eroare;
    return false;
  }

  pMesaj.innerText = "";

  let mNoua = new masina(marca, model, culoare, an);
  masini2Store.push(mNoua);

  let myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArrayDate", myJSON);

  afiseazaTabel();

  document.getElementById("marca").value = "";
  document.getElementById("model").value = "";
  document.getElementById("culoare").value = "";
  document.getElementById("anFab").value = "";

  return false;
}

function stergeTot() {
  localStorage.removeItem("carsArrayDate");
  masini2Store.length = 0;
  afiseazaTabel();
  document.getElementById("mesaj").innerText = "";
}
</script>
</body>
</html>
