<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
   <input id="marca" placeholder="Marca" required> 
   <input id="model" placeholder="Model" required> 
   <input id="culoare" placeholder="Culoare" required> 
   <input id="anFab" type="number" placeholder="An fabricatie" required> 
   <button type="submit">Adauga masina</button> 
</form> 
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
/* 
    RĂSPUNSURI EXERCIȚIUL 6
   
  (a) Ce aduce nou L8_C față de L8_B:
      - Tabloul `masini2Store`: Memorează în memorie o colecție (un array) cu toate mașinile adăugate în sesiune.
      - Cheia `carsArray`: Stochează în `localStorage` un șir JSON reprezentând un tablou (array) de obiecte mașină, 
        spre deosebire de L8_B unde se salva o singură mașină pe o cheie unică.
      - Bucla de la încărcare (`for`): Parcurge tabloul extras și deserializat din `localStorage`, afișează fiecare 
        mașină în tabel și o adaugă în `masini2Store`, permițând astfel păstrarea și afișarea tuturor mașinilor salvate anterior, 
        în ordinea adăugării.
*/

const masini2Store = [];

function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  }
}

var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if(localStorage.carsArray) {
  let arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  for(i = 0; i < masiniStored.length; i++){
    document.getElementById("tm").innerHTML += masiniStored[i].randNou; 
    masini2Store.push(masiniStored[i]);
  }
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "") {
    return "Marca nu poate fi goală sau formată doar din spații.";
  }
  if (model.trim() === "") {
    return "Modelul nu poate fi gol sau format doar din spații.";
  }
  if (culoare.trim() === "") {
    return "Culoarea nu poate fi goală sau formată doar din spații.";
  }

  var anInt = Number(an);
  var anCurent = new Date().getFullYear();
  if (isNaN(anInt) || !Number.isInteger(anInt) || anInt < 1900 || anInt > anCurent) {
    return "Anul fabricației trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
  }

  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  var pMesaj = document.getElementById("mesaj");

  if (eroare !== "") {
    pMesaj.innerText = eroare;
    return false;
  }

  pMesaj.innerText = "";

  var mNoua = new masina(marca, model, culoare, an);

  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  masini2Store.push(mNoua);
  var myJSON = JSON.stringify(masini2Store);

  localStorage.setItem("carsArray", myJSON);

  return false;
}
</script>
</body>
</html>
