<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1 > Masinile dorite </h1>

<form onsubmit="return adaugaMasina()">
   <input id="marca" placeholder="Marca" required> 
   <input id="model" placeholder="Model" required> 
   <input id="culoare" placeholder="Culoare" required> 
   <input id="anFab" type="number" placeholder="An fabricatie" required> 
   <button type="submit">Adauga masina</button> 
</form> 
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
/* 
    RĂSPUNSURI EXERCIȚIUL 4
   
  (a) Ce conține cheia masinaN după adăugarea unei mașini?
      - Conține un șir de caractere (string) în format JSON care reprezintă obiectul mașină, 
        incluzând proprietățile sale (cum ar fi marca, model, culoare) și proprietatea 'randNou' transformată în șir HTML.
        Exemplu: {marca: "Ford", model: "Focus", culoare: "Rosie",…}
                 culoare: "Rosie"
                 marca: "Ford"
                 model: "Focus"
                 randNou: "<tr><td>Ford</td><td>Focus</td><td>Rosie</td></tr>"

  (b) De ce, înainte de JSON.stringify, linia mNoua.randNou = mNoua.randNou().toString(); înlocuiește metoda cu un text – ce s-ar întâmpla fără ea?
      - Metoda JSON.stringify() ignoră și omite automat funcțiile/metodele dintr-un obiect atunci când îl serializează. 
        Fără această linie, proprietatea 'randNou' (fiind o funcție) nu s-ar salva în localStorage, iar la reîncărcare 
        obiectul nu ar mai avea această proprietate utilă pentru afișare în tabel. Prin această linie, funcția este 
        executată și convertită în șirul HTML corespunzător.

  (c) De ce la reîncărcare se scrie mNoua.randNou, fără paranteze?
      - Deoarece după JSON.parse(), proprietatea 'randNou' a devenit un simplu șir de caractere (string-ul HTML salvat), 
        și nu mai este o funcție care să necesite apelare cu paranteze.

  (d) Câte mașini adăugate apar după reîncărcare, comparativ cu L8_A?
      - Apare o singură mașină adăugată (ultima salvată), exact ca în L8_A, deoarece noua salvare suprascrie 
        valoarea existentă din localStorage pe cheia unică masinaN.
*/

var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if(localStorage.masinaN) {
  var masinaJSON = localStorage.masinaN;
  var mNoua = JSON.parse(masinaJSON);

  document.getElementById("tm").innerHTML += mNoua.randNou; 
}

function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  }
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "") {
    return "Marca nu poate fi goală sau formată doar din spații.";
  }
  if (model.trim() === "") {
    return "Modelul nu poate fi gol sau format doar din spații.";
  }
  if (culoare.trim() === "") {
    return "Culoarea nu poate fi goală sau formată doar din spații.";
  }

  var anInt = Number(an);
  var anCurent = new Date().getFullYear();
  if (isNaN(anInt) || !Number.isInteger(anInt) || anInt < 1900 || anInt > anCurent) {
    return "Anul fabricației trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
  }

  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  var pMesaj = document.getElementById("mesaj");

  if (eroare !== "") {
    pMesaj.innerText = eroare;
    return false;
  }

  pMesaj.innerText = "";

  var mNoua = new masina(marca, model, culoare, an);

  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  var myJSON = JSON.stringify(mNoua);

  localStorage.setItem("masinaN", myJSON);

  return false;
}
</script>
</body>
</html>
