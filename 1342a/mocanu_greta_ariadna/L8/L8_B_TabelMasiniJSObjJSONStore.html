<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1> Masinile dorite </h1>


<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th> 
  </tr>
</table>

<script>

var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 


if(localStorage.masinaN) {
    var masinaJSON = localStorage.masinaN;
    var mNoua = JSON.parse(masinaJSON);
    
  
    document.getElementById("tm").innerHTML += mNoua.randNou; 
}

function masina(mk, md, cl, an){
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;
    this.randNou = function() {
        return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
    };
}


function valideaza(marca, model, culoare, an) {
    if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
        return "Completati marca, modelul si culoarea fara a folosi doar spatii goale.";
    }
    
    var anCurent = new Date().getFullYear();
    if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
        return "Anul de fabricatie trebuie sa fie numar intreg intre 1900 si " + anCurent + ".";
    }
    return "";
}

function citesteFormular() {
    var marca = document.getElementById("marca").value;
    var model = document.getElementById("model").value;
    var culoare = document.getElementById("culoare").value;
    var an = Number(document.getElementById("anFab").value);
    
    var eroare = valideaza(marca, model, culoare, an);
    document.getElementById("mesaj").innerHTML = eroare;
    
    if (eroare !== "") {
        return null; 
    }
    
    return new masina(marca.trim(), model.trim(), culoare.trim(), an);
}

function adaugaMasina() {
    var mNoua = citesteFormular();
    
    
    if (mNoua !== null) {
        document.getElementById("tm").innerHTML += mNoua.randNou(); 
     
        mNoua.randNou = mNoua.randNou().toString();

        var myJSON = JSON.stringify(mNoua);
        localStorage.setItem("masinaN", myJSON);
        
        document.getElementById("marca").value = "";
        document.getElementById("model").value = "";
        document.getElementById("culoare").value = "";
        document.getElementById("anFab").value = "";
    }
    
    return false; 
}
</script>
</body>
</html>

<!-- Răspunsuri Exercițiul 4: 
(a) Conține un șir de caractere (string) în format JSON, care include datele mașinii și rezultatul metodei randNou

(b) Funcția JSON.stringify() ignoră complet metodele (funcțiile) unui obiect; ea transformă în text doar proprietățile de date. Linia de cod de mai sus apelează funcția mNoua.randNou(), extrage textul (codul HTML al rândului <tr>...</tr>) și îl salvează în aceeași proprietate suprascriind funcția. Astfel, proprietatea devine un șir de caractere (string) și este salvată cu succes în JSON.
Fără această linie, randNou (fiind o funcție) ar fi fost complet omisă din JSON. 

(c) Deoarece prin metoda explicată la punctul (b), ceea ce citim cu JSON.parse(masinaJSON) nu mai conține o funcție executabilă, ci conține un simplu text (string HTML). Parantezele () se folosesc exclusiv pentru a apela funcții. Adăugând direct mNoua.randNou la innerHTML, noi injectăm de fapt codul <tr>...</tr> salvat.

(d) Apare EXACT UNA (ultima mașină adăugată). Deoarece datele se salvează mereu sub aceeași cheie ("masinaN"), fiecare adăugare nouă suprascrie obiectul salvat anterior. Comportamentul este identic cu L8_A.
-->
