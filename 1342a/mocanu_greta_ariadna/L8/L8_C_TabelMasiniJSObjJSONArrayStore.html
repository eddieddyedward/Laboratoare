<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}


#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1 > Masinile dorite </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th> 
  </tr>
</table>

<script>

const masini2Store = [];

if(localStorage.carsArray) {
    let arrayJSON = localStorage.carsArray;
    var masiniStored = JSON.parse(arrayJSON);
    
    for(var i = 0; i < masiniStored.length; i++) {
        document.getElementById("tm").innerHTML += masiniStored[i].randNou; 
        
        masini2Store.push(masiniStored[i]);
    }
}


function masina(mk, md, cl, an){
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;
    this.randNou = function() {
        return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
    };
}


function valideaza(marca, model, culoare, an) {
    if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
        return "Completati marca, modelul si culoarea (fara a folosi doar spatii).";
    }
    
    var anCurent = new Date().getFullYear();
    if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
        return "Anul de fabricatie trebuie sa fie intre 1900 si " + anCurent + ".";
    }
    
    return "";
}

function citesteFormular() {
    var marca = document.getElementById("marca").value;
    var model = document.getElementById("model").value;
    var culoare = document.getElementById("culoare").value;
    var an = Number(document.getElementById("anFab").value);
    
    var eroare = valideaza(marca, model, culoare, an);
    document.getElementById("mesaj").innerHTML = eroare;
    
    if (eroare !== "") {
        return null;
    }
    
    return new masina(marca.trim(), model.trim(), culoare.trim(), an);
}

function adaugaMasina() {
    var mNoua = citesteFormular();
    
    if (mNoua !== null) {
        document.getElementById("tm").innerHTML += mNoua.randNou(); 
        
        mNoua.randNou = mNoua.randNou().toString();
        
        masini2Store.push(mNoua);
        
        var myJSON = JSON.stringify(masini2Store);
        localStorage.setItem("carsArray", myJSON);
        
        document.getElementById("marca").value = "";
        document.getElementById("model").value = "";
        document.getElementById("culoare").value = "";
        document.getElementById("anFab").value = "";
    }
    
    return false; 
}
</script>

<!-- 
EXPLICATII EXERCITIUL 6 (Diferente fata de L8_B):
L8_B (Ex. 4, 5) stoca intotdeauna datele sub forma unui singur obiect JSON, salvat la cheia "masinaN". De fiecare data cand utilizatorul introducea o noua masina, obiectul anterior era complet suprascris.
Imbunatatiri:
1. Creeaza in variabila globala tabloul gol "masini2Store".
2. Utilizeaza cheia "carsArray", care, sub forma unui JSON deserializat (JSON.parse), devine un tablou intreg (lista cu toate masinile).
3. Metoda "masini2Store.push(...)" adauga elementul cel nou LA FINALUL LISTEI fara a pierde restul elementelor.
4. La final, functia JSON.stringify(masini2Store) salveaza din nou intregul tablou actualizat. Astfel, la orice reincalcare, un for loop (bucla) repopuleaza dinamic intreaga lista afisand tot istoricul adaugat (o masina sub alta, exact in ordinea insertiei). 
-->
</body>
</html>
