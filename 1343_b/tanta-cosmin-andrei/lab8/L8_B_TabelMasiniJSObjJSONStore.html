<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()" >
    <input id="marca" placeholder="Marca">
    <input id="model" placeholder="Model">
    <input id="culoare" placeholder="Culoare">
    <input id="anFab" type="number" placeholder="An fabricatie">
    <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"> </p>

<table id="tm">
 <tr>
 <th>Marca</th>
 <th>Model</th>
 <th>Culoare</th>
 <th>An fabricatie</th>
 </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou();
document.getElementById("tm").innerHTML += m2.randNou();

if (localStorage.masinaN) {
  var masinaJSON = localStorage.masinaN;
  var mNoua = JSON.parse(masinaJSON);
  document.getElementById("tm").innerHTML += mNoua.randNou;
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model +
      "</td><td>" + this.culoare + "</td><td>" + this.anFab +
      "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {

  if ( marca.trim() === "")
    return "Campul marca nu poate fi gol."

  if ( model.trim() === "" )
    return "Campul model nu poate fi gol."

  if (culoare.trim() === "" )
    return "Campul culoare nu poate fi gol."

  if (an === "" )
    return "Campul an nu poate fi gol."

  var anNumar = parseInt(an);
  var anCurent = new Date().getFullYear();

  if (isNaN(anNumar) || anNumar < 1900 || anNumar > anCurent) 
    return "Anul trebuie sa fie intre 1900 si " + anCurent + ".";
  

  return "";
}

function adaugaMasina() {

  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;
  var textEroare = valideaza(marca, model, culoare, an);

  if (textEroare !== "") {
    document.getElementById("mesaj").innerHTML = textEroare;
    return false;
  }

  document.getElementById("mesaj").innerHTML = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou();
  mNoua.randNou = mNoua.randNou().toString();

  var myJSON = JSON.stringify(mNoua);
  localStorage.setItem("masinaN", myJSON);

  return false;
}

/* Explicatii EX 4)
a)
cheia masinaN contine un text JSON reprezentand ultma masina adaugata: marca, modelul, culoarea ca text HTML si forma ei in randNou

b)
mNoua.randNou() apeleaza metoda si returneaza sirul HTML, iar toString() il transforma în text. Apoi proprietatea randNou
este superscrisa cu acel text. 

c) 
Dupa JSON.parse, randNou nu mai este functie, ci text. De aceea este folosit fara paranteze. Cu paranteze s-ar incerca apelarea unui text si
s-ar produce o eroare de tip TypeError.

d) Dupa reincarcare apare o singura masina adaugata: ultima, deoarece fiecare adaugare suprascrie cheia masina, identic la L8_A


*/
</script>
</body>
</html>
