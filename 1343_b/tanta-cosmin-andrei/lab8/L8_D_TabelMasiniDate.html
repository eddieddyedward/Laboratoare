<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
 <input id="marca" placeholder="Marca">
 <input id="model" placeholder="Model">
 <input id="culoare" placeholder="Culoare">
 <input id="anFab" type="number" placeholder="An fabricatie">
 <button type="submit">Adauga masina</button>
 <button type="button" onclick="stergeToate()">Sterge toate</button>
</form>
<p id="mesaj"></p>
<table id="tm">
 <tr>
 <th>Marca</th>
 <th>Model</th>
 <th>Culoare</th>
 <th>An fabricatie</th>
 </tr>
</table>

<script>

/*Explicatie:

Pentru aceasta varianta, in localStorage se pastreaza doar datele masinilor. La incarcare, fiecare set de date este folosit pentru a crea un obiect nou
cu masina(), astfel incat obiectul sa aiba din nou metoda randNou().

*/

const masini2Store = [];

if (localStorage.carsArrayD) {
  var arrayJSON = localStorage.carsArrayD;
  var masiniStored = JSON.parse(arrayJSON);

  for (var i = 0; i < masiniStored.length; i++) {
    var masinaCitita = new masina(
      masiniStored[i].marca,
      masiniStored[i].model,
      masiniStored[i].culoare,
      masiniStored[i].anFab
    );

    masini2Store.push(masinaCitita);
    document.getElementById("tm").innerHTML += masinaCitita.randNou();
  }
}

function masina(mk, md, cl, an) {

  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {

    return "<tr><td>" + this.marca + "</td><td>" + this.model +
      "</td><td>" + this.culoare + "</td><td>" + this.anFab +
      "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {

  if (marca.trim() === "") 
    return "Campul marca nu poate fi gol.";
  
  if (model.trim() === "") 
    return "Campul model nu poate fi gol.";
  
  if (culoare.trim() === "") 
    return "Campul culoare nu poate fi gol.";
  
  if (an === "") 
    return "Campul an nu poate fi gol.";
  
  var anNumar = parseInt(an);
  var anCurent = new Date().getFullYear();

  if (isNaN(anNumar) || anNumar < 1900 || anNumar > anCurent) 
    return "Anul trebuie sa fie intre 1900 si " + anCurent + ".";
  

  return "";
}

function adaugaMasina() {

  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;
  var textEroare = valideaza(marca, model, culoare, an);

  if (textEroare !== "") {
    document.getElementById("mesaj").innerHTML = textEroare;
    return false;
  }

  document.getElementById("mesaj").innerHTML = "";

  var mNoua = new masina(marca, model, culoare, an);
  var dateMasina = {
    marca: mNoua.marca,
    model: mNoua.model,
    culoare: mNoua.culoare,
    anFab: mNoua.anFab
  };

  document.getElementById("tm").innerHTML += mNoua.randNou();
  masini2Store.push(dateMasina);

  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArrayD", myJSON);

  return false;
}

function stergeToate() {
  masini2Store.length = 0;
  localStorage.removeItem("carsArrayD");
  document.getElementById("tm").innerHTML =
    "<tr><th>Marca</th><th>Model</th><th>Culoare</th><th>An fabricatie</th></tr>";
  document.getElementById("mesaj").innerHTML = "";

}
</script>
</body>
</html>
