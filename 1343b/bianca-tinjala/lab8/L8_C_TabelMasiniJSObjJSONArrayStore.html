<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini - Stocare array obiecte</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  margin-top: 15px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

input, button {
  padding: 6px 10px;
  margin: 4px;
}

#mesaj {
  font-weight: bold;
  margin-top: 8px;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<!-- Exercițiul 6: Formular in loc de prompt -->
<form id="formMasina" onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<!-- Paragraf pentru afisarea mesajelor de validare -->
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
// Tabloul in care acumulam obiectele mașinilor în memorie
const masini2Store = [];

// Bucla de la incarcare: reface intregul tabel din tabloul salvat in Local Storage
if (localStorage.carsArray) {
  let arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  for (var i = 0; i < masiniStored.length; i++) {
    // Adaugam randul HTML salvat ca proprietate string
    document.getElementById("tm").innerHTML += masiniStored[i].randNou;
    // Pastram masina in tabloul din memorie pentru ca viitoarele adaugari sa nu piarda istoricul
    masini2Store.push(masiniStored[i]);
  }
}

// Functie constructor masina cu anul de fabricatie inclus
function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

// Functie de validare a campurilor
function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "") {
    return "Marca nu poate fi goală sau formată doar din spații.";
  }
  if (model.trim() === "") {
    return "Modelul nu poate fi gol sau format doar din spații.";
  }
  if (culoare.trim() === "") {
    return "Culoarea nu poate fi goală sau formată doar din spații.";
  }
  var anNum = Number(an);
  var anCurent = new Date().getFullYear();
  if (!Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
  }
  return "";
}

// Functia de adaugare a masinii
function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  var pMesaj = document.getElementById("mesaj");

  if (eroare !== "") {
    pMesaj.textContent = eroare;
    pMesaj.style.color = "red";
    return false;
  }

  // La o adaugare corecta stergem eroarea
  pMesaj.textContent = "";

  var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));

  // Afisam randul nou in tabel
  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  // Transformam metoda in text HTML pentru a putea fi serializata in JSON
  mNoua.randNou = mNoua.randNou().toString();

  // Adaugam obiectul masinii in tabloul masini2Store
  masini2Store.push(mNoua);

  // Serializam intregul tablou si il salvam sub cheia carsArray
  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);

  document.getElementById("formMasina").reset();
  return false;
}
</script>

<!--
Explicatii Exercitiul 6 - Ce aduce nou L8_C fata de L8_B:

1. Tabloul 'masini2Store':
   - Spre deosebire de L8_B (unde se pastra doar un singur obiect), aici avem un tablou (array) care strange in memorie toate masinile create sau restaurate din stocare.
   - La fiecare adaugare, noua masina este impinsa la sfarsitul tabloului cu 'masini2Store.push(mNoua)'.

2. Cheia 'carsArray' in Local Storage:
   - In loc sa stocam un singur obiect (sub cheia masinaN), salvam intregul tablou ca un text JSON (JSON.stringify(masini2Store)).
   - Astfel, adaugarea unei masini noi NU mai suprascrie masinile vechi, ci se pastreaza o lista completa.

3. Bucla 'for' de la incarcare:
   - La deschiderea/reincarcarea paginii, tabloul salvat este parcurs element cu element.
   - Pentru fiecare masina gasita, se adauga codul randului de tabel (masiniStored[i].randNou) in DOM si se reintroduce obiectul in masini2Store, pastrand ordinea exacta in care au fost introduse masinile.
-->
</body>
</html>
