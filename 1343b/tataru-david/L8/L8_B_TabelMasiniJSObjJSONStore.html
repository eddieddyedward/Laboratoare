<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini - Obiect JSON</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}
td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if (localStorage.masinaN) {
    var masinaJSON = localStorage.masinaN;
    var mNoua = JSON.parse(masinaJSON);
    document.getElementById("tm").innerHTML += mNoua.randNou;
}

function masina(mk, md, cl, an) {
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;
    this.randNou = function() {
        return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
    };
}

function valideaza(marca, model, culoare, an) {
    if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
        return "Eroare: Marca, modelul si culoarea nu pot fi goale sau formate doar din spatii!";
    }
    var anNumar = Number(an);
    var anCurent = new Date().getFullYear();
    if (!Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
        return "Eroare: Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";
    }
    return "";
}

function adaugaMasina() {
    var marca = document.getElementById("marca").value;
    var model = document.getElementById("model").value;
    var culoare = document.getElementById("culoare").value;
    var an = document.getElementById("anFab").value;

    var eroare = valideaza(marca, model, culoare, an);
    var pMesaj = document.getElementById("mesaj");

    if (eroare !== "") {
        pMesaj.innerHTML = eroare;
        return false;
    }

    pMesaj.innerHTML = "";
    var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
    document.getElementById("tm").innerHTML += mNoua.randNou(); 

    mNoua.randNou = mNoua.randNou().toString();
    var myJSON = JSON.stringify(mNoua);
    localStorage.setItem("masinaN", myJSON);

    return false;
}
</script>

<!--
Raspunsuri ex 4:
a. Cheia masinaN contine un sdc (text JSON) care reprezinta obiectul in serie cu toate proprietatile sale, inclusiv randNou transformat in text HTML. 
b. Functia JSON.stringify() ignora si elimina complet metodele din obiecte. Fara linia respectiva, proprietatea randNou s ar pierde la salvare, 
iar la reincarcare mNoua.randNou ar fi undefined.
c. La reincarcare, dupa JSON.parse(), randNou nu mai este o metoda, ci o proprietate de tip text (string) care contine deja codul HTML al randului. 
Daca am pune paranteze mNoua.randNou(), browserul ar da eroare precizand ca nu este o functie.
d. La fel ca in L8_A, dupa reincarcare apare o singura masina adaugata, anume, ultima introdusa, 
deoarece fiecare masina noua suprascrie aceeasi cheie (masinaN) din Local Storage.
-->
</body>
</html>
