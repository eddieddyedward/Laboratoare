<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini - Obiect JSON</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" min="1900" max="2026" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if(localStorage.masinaN) {
  var masinaJSON = localStorage.masinaN;
  var mNoua = JSON.parse(masinaJSON);
  document.getElementById("tm").innerHTML += mNoua.randNou; 
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  if (marca === "") {
    return "Eroare: Marca nu poate fi goala sau formata doar din spatii.";
  }
  if (model === "") {
    return "Eroare: Modelul nu poate fi gol sau format doar din spatii.";
  }
  if (culoare === "") {
    return "Eroare: Culoarea nu poate fi goala sau formata doar din spatii.";
  }
  
  var anCurent = new Date().getFullYear();
  if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
    return "Eroare: Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value.trim();
  var model = document.getElementById("model").value.trim();
  var culoare = document.getElementById("culoare").value.trim();
  var an = Number(document.getElementById("anFab").value);

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerText = eroare;
    return false;
  }

  document.getElementById("mesaj").innerText = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  var myJSON = JSON.stringify(mNoua);
  localStorage.setItem("masinaN", myJSON);

  return false;
}
</script>


<!--
a) cheia "masinaN" contine un sir de caractere care reprezinta marca, model, culoare, anFab și randNou 
b) functia ignora complet proprietatile care sunt functii; in obiectul mNoua, randNou este initial o functie; fara ea s-ar ignora complet functiile
c) cand se face JSON.parse(), mNoua este doar un obiect obisnuit, iar randNou este o proprietate de tip text (string), nu o functie pe care sa o poti apela cu paranteze
d) la fel ca în L8_A, dupa reincarcare apare o singura masina adaugata (ultima introdusa), deoarece fiecare salvare noua suprascrie valoarea cheii "masinaN"
-->
</body>
</html>
