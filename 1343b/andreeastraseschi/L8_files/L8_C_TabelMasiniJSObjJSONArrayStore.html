<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini - Array JSON</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" min="1900" max="2026" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
const masini2Store = [];

if(localStorage.carsArray) {
  let arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  for(var i = 0; i < masiniStored.length; i++) {
    document.getElementById("tm").innerHTML += masiniStored[i].randNou;
    masini2Store.push(masiniStored[i]);
  }
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  if (marca === "") {
    return "Eroare: Marca nu poate fi goala sau formata doar din spatii.";
  }
  if (model === "") {
    return "Eroare: Modelul nu poate fi gol sau format doar din spatii.";
  }
  if (culoare === "") {
    return "Eroare: Culoarea nu poate fi goala sau formata doar din spatii.";
  }
  
  var anCurent = new Date().getFullYear();
  if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
    return "Eroare: Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value.trim();
  var model = document.getElementById("model").value.trim();
  var culoare = document.getElementById("culoare").value.trim();
  var an = Number(document.getElementById("anFab").value);

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerText = eroare;
    return false;
  }

  document.getElementById("mesaj").innerText = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  masini2Store.push(mNoua);
  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);

  return false;
}
</script>

<!--
1. tabloul "masini2Store": pastreaza în memorie o lista cu 
toate masinile adaugate; la fiecare introducere a unei masini noi,
 aceasta este adaugata la sfarsitul tabloului cu ajutorul metodei push()
2. cheia "carsArray": permite stocarea a intregului tablou sub forma 
unui singur sir JSON, pastrand astfel istoricul complet al tuturor masinilor salvate
3. bucla "for" de la incarcare: citeste si parcurge elementele salvate
 anterior, le afiseaza secvential in tabel in ordinea in care au fost adaugate si 
 se asigura ca urmatoarele mmasini adaugate vor continua lista existenta fara a șterge 
 datele vechi
-->
</body>
</html>
