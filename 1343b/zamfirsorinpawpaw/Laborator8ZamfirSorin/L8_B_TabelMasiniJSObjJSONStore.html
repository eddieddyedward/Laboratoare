<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini - L8_B</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}
td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masini dorite (Obiect JSON)</h1>

<form id="formMasina" onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<p><a href="index.html">Înapoi la meniu</a></p>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou();
document.getElementById("tm").innerHTML += m2.randNou();

if (localStorage.masinaN) {
  var masinaJSON = localStorage.masinaN;
  var mNoua = JSON.parse(masinaJSON);
  document.getElementById("tm").innerHTML += mNoua.randNou; // proprietate text
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, anStr) {
  if (marca.trim() === "") return "Marca nu poate fi goală sau formată doar din spații!";
  if (model.trim() === "") return "Modelul nu poate fi gol sau format doar din spații!";
  if (culoare.trim() === "") return "Culoarea nu poate fi goală sau formată doar din spații!";

  var an = Number(anStr);
  var anCurent = new Date().getFullYear();
  if (anStr.trim() === "" || !Number.isInteger(an) || an < 1900 || an > anCurent) {
    return "Anul fabricației trebuie să fie un număr întreg între 1900 și " + anCurent + "!";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerHTML = eroare;
    return false;
  }

  document.getElementById("mesaj").innerHTML = "";
  var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
  document.getElementById("tm").innerHTML += mNoua.randNou();

  mNoua.randNou = mNoua.randNou().toString();
  var myJSON = JSON.stringify(mNoua);
  localStorage.setItem("masinaN", myJSON);

  document.getElementById("formMasina").reset();
  return false;
}
</script>

<!--
Raspunsuri Exercitiul 4:
(a) Cheia masinaN contine un text in format JSON care reprezinta obiectul masinii, avand proprietatile marca, model, culoare, anFab si randNou (unde randNou este salvat ca sir de caractere HTML: "<tr><td>...</td></tr>").
(b) Functia JSON.stringify() ignora si omite functiile (metodele) dintr-un obiect. Fara acea linie, proprietatea randNou nu ar fi ajuns in textul JSON, iar la reincarcarea paginii mNoua.randNou ar fi fost undefined (ar fi afisat "undefined" in tabel).
(c) Dupa JSON.parse(), obiectul mNoua este un obiect simplu, nu o instanta creata cu "new masina". Proprietatea randNou nu mai este o functie, ci un simplu text (string) deja formatat, deci se acceseaza fara paranteze (apelarea cu () ar da eroare).
(d) Dupa reincarcare apare tot o singura masina adaugata (ultima introdusa), la fel ca in L8_A, deoarece fiecare noua adaugare suprascrie aceeasi cheie "masinaN" din Local Storage.
-->
</body>
</html>
