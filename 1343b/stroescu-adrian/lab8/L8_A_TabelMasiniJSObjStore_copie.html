<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if (localStorage.marca) {
  var mNoua = new masina(localStorage.marca, localStorage.model, localStorage.culoare, localStorage.anFab);
  document.getElementById("tm").innerHTML += mNoua.randNou();
}

function validare(marca, model, culoare, an) {
  if (marca === "" || model === "" || culoare === "") {
    return "Marca, modelul, culoarea nu pot fi goale";
  }
  
  var anCurent = new Date().getFullYear();
  var anInt = Number.parseInt(an, 10);

  if (!Number.isInteger(anInt) || anInt < 1900 || anInt > anCurent) {
    return "An fabricație trebuie să fie natural, în [1900, an curent]";
  }
  
  return "";
}
function citesteFormularul() {
  var marca = document.getElementById("marca").value.trim();
  var model = document.getElementById("model").value.trim();
  var culoare = document.getElementById("culoare").value.trim();
  var an = Number(document.getElementById("anFab").value);

  var eroare = validare(marca, model, culoare, an);
  document.getElementById("mesaj").innerHTML = eroare;

  if (eroare !== "") {
    return null;
  }

  return new masina(marca, model, culoare, an);
}

function adaugaMasina() {
  var mNoua = citesteFormularul();

  if (mNoua === null) {
    return false; 
  }

  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  localStorage.setItem("marca", mNoua.marca);
  localStorage.setItem("model", mNoua.model);
  localStorage.setItem("culoare", mNoua.culoare);
  localStorage.setItem("anFab", mNoua.anFab);

  return false; 
}
</script>

</body>
</html>
