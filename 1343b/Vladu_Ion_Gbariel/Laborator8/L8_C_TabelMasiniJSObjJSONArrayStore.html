<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel masini - L8_C</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
const masini2Store = [];

if(localStorage.carsArray) {
  let arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  for(var i = 0; i < masiniStored.length; i++) {
    document.getElementById("tm").innerHTML += masiniStored[i].randNou; 
    masini2Store.push(masiniStored[i]);
  }
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  var anCurent = new Date().getFullYear();
  if (marca === "" || model === "" || culoare === "") {
    return "Eroare: Marca, modelul și culoarea nu pot fi goale sau formate doar din spații!";
  }
  if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
    return "Eroare: Anul fabricației trebuie să fie un număr întreg între 1900 și " + anCurent + "!";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value.trim();
  var model = document.getElementById("model").value.trim();
  var culoare = document.getElementById("culoare").value.trim();
  var anVal = document.getElementById("anFab").value.trim();
  var an = anVal === "" ? NaN : Number(anVal);

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerText = eroare;
    return false;
  }

  document.getElementById("mesaj").innerText = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  masini2Store.push(mNoua);
  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);

  return false;
}
</script>

<!--
Explicatie Exercitiul 6 (noutati fata de L8_B):
- Tabloul masini2Store: retine in memorie lista tuturor masinilor adaugate, permitand adaugarea lor la final cu .push() fara a le suprascrie pe cele vechi[cite: 3, 4, 6].
- Cheia carsArray: salveaza in Local Storage intregul tablou serializat ca un array JSON de obiecte (ex: [{"marca":"Dacia",...}, {"marca":"BMW",...}]), nu doar un singur obiect ca in L8_B[cite: 2, 3, 6].
- Bucla for de la incarcare: parcurge elementele citite din carsArray, le afiseaza randurile in tabel si le reincarca in masini2Store pentru a pastra istoricul la adaugarile viitoare[cite: 3, 6].
-->
</body>
</html>
