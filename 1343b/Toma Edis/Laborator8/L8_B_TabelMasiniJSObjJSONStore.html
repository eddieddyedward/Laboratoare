<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>L8_B - Tabel Masini (Obiect JSON)</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }
        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        #mesaj {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Masinile dorite</h2>

    <form onsubmit="return adaugaMasina()">
        <input id="marca" placeholder="Marca" required>
        <input id="model" placeholder="Model" required>
        <input id="culoare" placeholder="Culoare" required>
        <input id="anFab" type="number" placeholder="An fabricatie" required>
        <button type="submit">Adauga masina</button>
    </form>

    <p id="mesaj"></p>

    <table id="tm">
        <tr>
            <th>Marca</th>
            <th>Model</th>
            <th>Culoare</th>
            <th>An fabricatie</th>
        </tr>
    </table>

    <script>
        var m1 = new masina("Opel", "Zafira", "gri", 2015);
        var m2 = new masina("Seat", "Ibiza", "roz", 2018);
        document.getElementById("tm").innerHTML += m1.randNou();
        document.getElementById("tm").innerHTML += m2.randNou();

        if (localStorage.masinaN) {
            var mNoua = JSON.parse(localStorage.masinaN);
            document.getElementById("tm").innerHTML += mNoua.randNou;
        }

        function masina(mk, md, cl, an) {
            this.marca = mk;
            this.model = md;
            this.culoare = cl;
            this.anFab = an;
            this.randNou = function() {
                return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
            };
        }

        function valideaza(marca, model, culoare, an) {
            if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
                return "Marca, modelul si culoarea nu pot fi goale sau formate doar din spatii!";
            }
            var anNumar = Number(an);
            var anCurent = new Date().getFullYear();
            if (!Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
                return "Anul fabricatiei trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";
            }
            return "";
        }

        function adaugaMasina() {
            var marca = document.getElementById("marca").value;
            var model = document.getElementById("model").value;
            var culoare = document.getElementById("culoare").value;
            var an = document.getElementById("anFab").value;

            var eroare = valideaza(marca, model, culoare, an);
            document.getElementById("mesaj").innerHTML = eroare;

            if (eroare !== "") {
                return false;
            }

            var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
            document.getElementById("tm").innerHTML += mNoua.randNou();

            mNoua.randNou = mNoua.randNou().toString();
            localStorage.setItem("masinaN", JSON.stringify(mNoua));

            return false;
        }
    </script>

    <!--
    (a) Cheia masinaN contine datele masinii si codul HTML al randului salvate ca un singur text JSON
    (b) JSON.stringify sterge functiile dintr-un obiect daca nu am transforma metoda randNou in text inainte de salvare randul de tabel s-ar pierde si ar aparea undefined la reincarcare
    (c) La reincarcare, randNou este acum un simplu text nu o functie deci se foloseste fara paranteze
    (d) Apare tot o singura masina adaugata la fel ca in L8_A deoarece fiecare masina noua suprascrie aceeasi cheie masinaN
    -->
</body>
</html>
