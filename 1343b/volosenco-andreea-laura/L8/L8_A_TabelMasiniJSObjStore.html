<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);
document.getElementById("tm").innerHTML += m1.randNou();
document.getElementById("tm").innerHTML += m2.randNou();

if (localStorage.marca) {
  var mNoua = new masina(
    localStorage.marca,
    localStorage.model,
    localStorage.culoare,
    localStorage.anFab
  );
  document.getElementById("tm").innerHTML += mNoua.randNou();
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model +
           "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  var anCurent = new Date().getFullYear();

  if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
    return "Datele introduse nu sunt valide!";
  }

  var anNumar = Number(an);
  if (an.trim() === "" || !Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
    return "Anul de fabricatie introdus nu este valid!";
  }

  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;
  var pMesaj = document.getElementById("mesaj");

  var eroare = valideaza(marca, model, culoare, an);

  if (eroare !== "") {
    pMesaj.innerHTML = eroare;
    return false;
  }

  pMesaj.innerHTML = "";

  var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
  document.getElementById("tm").innerHTML += mNoua.randNou();

  localStorage.setItem("marca", marca.trim());
  localStorage.setItem("model", model.trim());
  localStorage.setItem("culoare", culoare.trim());
  localStorage.setItem("anFab", Number(an));

  return false;
}
</script>
</body>
</html>
