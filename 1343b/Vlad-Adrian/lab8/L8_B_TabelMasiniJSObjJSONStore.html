<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <title>Tabel masini</title>
  <style>
    table {
      font-family: arial, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    td,
    th {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 8px;
    }

    #mesaj {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Masinile dorite</h1>

  <form onsubmit="return adaugaMasina()">
    <input id="marca" placeholder="Marca" required>
    <input id="model" placeholder="Model" required>
    <input id="culoare" placeholder="Culoare" required>
    <input id="anFab" type="number" placeholder="An fabricatie" required>
    <button type="submit">Adauga masina</button>
  </form>

  <p id="mesaj"></p>

  <table id="tm">
    <tr>
      <th>Marca</th>
      <th>Model</th>
      <th>Culoare</th>
      <th>An fabricatie</th>
    </tr>
  </table>

  <script>
    var m1 = new masina("Opel", "Zafira", "gri", 2015);
    var m2 = new masina("Seat", "Ibiza", "roz", 2018);

    document.getElementById("tm").innerHTML += m1.randNou();
    document.getElementById("tm").innerHTML += m2.randNou();

    if (localStorage.masinaN) {
      var masinaJSON = localStorage.masinaN;
      var mNoua = JSON.parse(masinaJSON);

      document.getElementById("tm").innerHTML += mNoua.randNou; // proprietate string salvată în JSON
    }

    function masina(mk, md, cl, an) {
      this.marca = mk;
      this.model = md;
      this.culoare = cl;
      this.anFab = an; // proprietate nouă
      this.randNou = function () {
        return "<tr><td>" + this.marca + "</td><td>" + this.model +
          "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
      };
    }

    function valideaza(marca, model, culoare, an) {
      if (marca.trim() === "") {
        return "Marca nu poate fi goală sau formată doar din spații.";
      }
      if (model.trim() === "") {
        return "Modelul nu poate fi gol sau format doar din spații.";
      }
      if (culoare.trim() === "") {
        return "Culoarea nu poate fi goală sau formată doar din spații.";
      }

      var anNum = Number(an);
      var anCurent = new Date().getFullYear();

      if (an.trim() === "" || !Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
        return "Anul de fabricație trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
      }

      return "";
    }

    function adaugaMasina() {
      var marca = document.getElementById("marca").value;
      var model = document.getElementById("model").value;
      var culoare = document.getElementById("culoare").value;
      var an = document.getElementById("anFab").value;

      var mesajEroare = valideaza(marca, model, culoare, an);
      var pMesaj = document.getElementById("mesaj");

      if (mesajEroare !== "") {
        pMesaj.textContent = mesajEroare;
        return false; // Nu se adaugă, nu se salvează, formularul nu reîncarcă pagina
      }

      pMesaj.textContent = "";

      var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), an);
      document.getElementById("tm").innerHTML += mNoua.randNou();

      mNoua.randNou = mNoua.randNou().toString();
      var myJSON = JSON.stringify(mNoua);

      localStorage.setItem("masinaN", myJSON);

      return false; // formularul nu reîncarcă pagina
    }
  </script>

  <!--
  Răspunsuri Exercițiul 4:
  (a) masinaN conține mașina salvată ca text JSON (proprietățile ei + rândul HTML ca text).
  (b) JSON nu poate salva funcții. Linia execută metoda și o transformă într-un text HTML simplu; 
      fără ea, randNou s-ar fi pierdut la salvare.
  (c) După JSON.parse(), obiectul este unul simplu, iar randNou este doar o proprietate de tip text, 
      nu o funcție (cu paranteze ar da eroare).
  (d) Apare doar o singură mașină adăugată (la fel ca în L8_A), pentru că la fiecare adăugare 
  -->
</body>

</html>
