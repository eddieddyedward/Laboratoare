<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <title>Tabel masini - doar date</title>
  <style>
    table {
      font-family: arial, sans-serif;
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }

    td,
    th {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 8px;
    }

    #mesaj {
      color: red;
      font-weight: bold;
    }

    .btn-sterge {
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 8px 14px;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-sterge:hover {
      background-color: #c9302c;
    }
  </style>
</head>

<body>
  <h1>Masinile dorite (doar date salvate)</h1>

  <form onsubmit="return adaugaMasina()">
    <input id="marca" placeholder="Marca" required>
    <input id="model" placeholder="Model" required>
    <input id="culoare" placeholder="Culoare" required>
    <input id="anFab" type="number" placeholder="An fabricatie" required>
    <button type="submit">Adauga masina</button>
    <button type="button" class="btn-sterge" onclick="stergeToate()">Sterge toate</button>
  </form>

  <p id="mesaj"></p>

  <table id="tm">
    <tr>
      <th>Marca</th>
      <th>Model</th>
      <th>Culoare</th>
      <th>An fabricatie</th>
    </tr>
  </table>

  <script>
    const masini2Store = [];

    function masina(mk, md, cl, an) {
      this.marca = mk;
      this.model = md;
      this.culoare = cl;
      this.anFab = an;
    }

    // Metoda pe prototip nu este serializată de JSON.stringify
    masina.prototype.randNou = function () {
      return "<tr><td>" + this.marca + "</td><td>" + this.model +
             "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
    };

    // La încărcare, refacem obiectele cu new masina() pentru a avea din nou metoda randNou()
    if (localStorage.carsArray) {
      let arrayJSON = localStorage.carsArray;
      var masiniStored = JSON.parse(arrayJSON);
      for (var i = 0; i < masiniStored.length; i++) {
        var date = masiniStored[i];
        var m = new masina(date.marca, date.model, date.culoare, date.anFab);
        document.getElementById("tm").innerHTML += m.randNou();
        masini2Store.push(m);
      }
    }

    function valideaza(marca, model, culoare, an) {
      if (marca.trim() === "") {
        return "Marca nu poate fi goală sau formată doar din spații.";
      }
      if (model.trim() === "") {
        return "Modelul nu poate fi gol sau format doar din spații.";
      }
      if (culoare.trim() === "") {
        return "Culoarea nu poate fi goală sau formată doar din spații.";
      }

      var anNum = Number(an);
      var anCurent = new Date().getFullYear();

      if (an.trim() === "" || !Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
        return "Anul de fabricație trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
      }

      return "";
    }

    function adaugaMasina() {
      var marca = document.getElementById("marca").value;
      var model = document.getElementById("model").value;
      var culoare = document.getElementById("culoare").value;
      var an = document.getElementById("anFab").value;

      var mesajEroare = valideaza(marca, model, culoare, an);
      var pMesaj = document.getElementById("mesaj");

      if (mesajEroare !== "") {
        pMesaj.textContent = mesajEroare;
        return false;
      }

      pMesaj.textContent = "";

      var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), an);
      document.getElementById("tm").innerHTML += mNoua.randNou();

      masini2Store.push(mNoua);
      // În localStorage se salvează doar proprietățile de date, randNou fiind pe prototype
      var myJSON = JSON.stringify(masini2Store);
      localStorage.setItem("carsArray", myJSON);

      return false;
    }

    function stergeToate() {
      localStorage.removeItem("carsArray");
      masini2Store.length = 0;
      document.getElementById("tm").innerHTML = `
        <tr>
          <th>Marca</th>
          <th>Model</th>
          <th>Culoare</th>
          <th>An fabricatie</th>
        </tr>
      `;
      document.getElementById("mesaj").textContent = "";
    }
  </script>

  <!--
  Explicație Exercițiul Bonus:
  Definind metoda randNou pe masina.prototype, JSON.stringify nu o serializează, salvând în Local Storage strict datele mașinilor.
  La reîncărcare, recreăm instanțele cu new masina(), recăpătând metoda.
  Avantajul major față de L8_C: dacă modificăm structura tabelului în cod, mașinile salvate se vor afișa automat cu noul format.
  Butonul "Sterge toate" golește atât Local Storage, cât și tabelul din pagină.
  -->
</body>

</html>
