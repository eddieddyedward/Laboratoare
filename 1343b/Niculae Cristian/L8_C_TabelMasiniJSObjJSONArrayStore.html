<!DOCTYPE html>
<html>
<head>
<title>Tabel masini - Ex 6 (Tablou JSON)</title>
<style>
table { font-family: arial, sans-serif; border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #dddddd; text-align: left; padding: 8px; }
#mesaj { color: red; font-weight: bold; }
</style>
</head>
<body>
<h1>Masinile dorite (Ex. 6 - Tablou de obiecte)</h1>

<form onsubmit="return adaugaMasina()">
    <input id="marca" placeholder="Marca" required>
    <input id="model" placeholder="Model" required>
    <input id="culoare" placeholder="Culoare" required>
    <input id="anFab" type="number" placeholder="An fabricație" required>
    <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricație</th>
  </tr>
</table>

<script>
function masina(mk, md, cl, an){
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;
    this.randNou = function() {
        return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
    };
}

var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);
document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

// Preluăm tabloul din Local Storage dacă există
var carsArray = [];
if(localStorage.carsArray) {
    carsArray = JSON.parse(localStorage.carsArray);
    for(var i = 0; i < carsArray.length; i++) {
        var mStocata = new masina(carsArray[i].marca, carsArray[i].model, carsArray[i].culoare, carsArray[i].anFab);
        document.getElementById("tm").innerHTML += mStocata.randNou();
    }
}

function valideaza(marca, model, culoare, anStr) {
    if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
        return "Câmpurile text nu pot fi goale sau formate doar din spații!";
    }
    var an = Number(anStr);
    var anCurent = new Date().getFullYear();
    if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
        return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + "!";
    }
    return "";
}

function adaugaMasina() {
    var marca = document.getElementById("marca").value;
    var model = document.getElementById("model").value;
    var culoare = document.getElementById("culoare").value;
    var an = document.getElementById("anFab").value;
    var pMesaj = document.getElementById("mesaj");

    var eroare = valideaza(marca, model, culoare, an);
    if (eroare !== "") {
        pMesaj.innerText = eroare;
        return false;
    }
    pMesaj.innerText = "";

    var mNoua = new masina(marca, model, culoare, an);
    document.getElementById("tm").innerHTML += mNoua.randNou(); 

    // Adăugăm în tablou și salvăm în Local Storage
    carsArray.push(mNoua);
    localStorage.setItem("carsArray", JSON.stringify(carsArray));

    return false;
}
</script>
</body>
</html>

<!--
Explicație Exercițiul 6:
Fata de L8_B unde se pastreaza o singura masina,aici salvam un tablou de masini.
La fiecare adaugare punem masina in lista cu .push(), iar la reincarcare le afisam pe toate folosind o bucla for
-->
