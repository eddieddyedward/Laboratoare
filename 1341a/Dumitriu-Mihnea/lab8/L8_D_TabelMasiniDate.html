<!DOCTYPE html>
<html>
<head>
<title>Tabel masini (Bonus)</title>
<style>
table { font-family: arial, sans-serif; border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #dddddd; text-align: left; padding: 8px; }
#mesaj { color: red; font-weight: bold; }
</style>
</head>
<body>
<h1> Masinile dorite (Numai date in JSON) </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
  <button type="button" onclick="stergeToate()">Sterge toate</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th> <th>Model</th> <th>Culoare</th> <th>An fabricatie</th>
  </tr>
</table>

<script>
const masini2Store = [];

masina.prototype.randNou = function() {
  return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
};

function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
}

if(localStorage.carsArray) {
  let arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  
  for(let i=0; i < masiniStored.length ; i++){
    
    let data = masiniStored[i];
    let mRecreata = new masina(data.marca, data.model, data.culoare, data.anFab);
    
    document.getElementById("tm").innerHTML += mRecreata.randNou(); 
    masini2Store.push(mRecreata);
  }
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") return "Eroare: Campuri goale.";
  var anCurent = new Date().getFullYear();
  if (!Number.isInteger(Number(an)) || an < 1900 || an > anCurent) return "Eroare: An invalid.";
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;
  
  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerText = eroare;
    return false;
  }
  
  document.getElementById("mesaj").innerText = "";
  
  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou(); 
  masini2Store.push(mNoua);
  

  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);
  
  return false;
}

function stergeToate() {
  localStorage.removeItem("carsArray");
  masini2Store.length = 0; 
  
  document.getElementById("tm").innerHTML = "<tr><th>Marca</th><th>Model</th><th>Culoare</th><th>An fabricatie</th></tr>";
}
</script>
<!--
  Daca pui atribute HTML  de tip min="1900" pe campul de input, browserul blocheaza complet trimiterea formularului 
  si iti arata bula lui default  motiv pentru care functia JavaScript nici nu se mai executa ca sa iti puna mesajul 
  rosu in pagina.

  Pentru a forta eroarea in modul dorit, lasam doar atributul "required" 
  care asigura ca nu se trimite gol, iar restul validarii matematice le delegam strict catre functia 
  valideaza() din JS care insereaza raspunsul in <p id="mesaj"></p>.
-->
</body>
</html>
