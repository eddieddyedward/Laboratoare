<!DOCTYPE html>
<html>
<head>
<title>Tabel melodii</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
 * {
        box-sizing: border-box;
      }
.loginPopup {
        position: relative;
        text-align: center;
        width: 100%;
      }
      .formPopup {
        display: none;
        position: fixed;
        left: 45%;
        top: 5%;
        transform: translate(-50%, 5%);
        border: 3px solid #999999;
        z-index: 9;
      }
	        .formContainer {
        max-width: 400px;
        padding: 20px;
        background-color: #fff;
      }
	        .formContainer input[type=text]{
        width: 80%;
        padding: 15px;
        margin: 5px 0 20px 0;
        border: none;
        background: #eee;
      }
</style>
</head>
<body>
<h1>Melodii incarcate de pe server</h1>

<p>

<button onclick="getAJAX('Melodii_JSON.txt')">Incarca array melodii de pe server</button>
<br><br><br>
<button onclick="loadTable()">Incarca tabel melodii</button>
<br><br><br>
<button onclick="openFormA()">Adauga melodie</button>
<table id="tm">
<tr>
    <th>Titlu</th>
    <th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
    <th colspan=2 style="text-align:center">Operatii</th>
  </tr>
</table>
</p>
<div><span id="raw"></span></div>

<div class="formPopup" id="adauga">
  <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
    <h2>Adauga melodie</h2>
    <label for="titlu"><strong>Titlu</strong></label>
    <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>
    <label for="interpret"><strong>Interpret</strong></label>
    <input type="text" id="interpret" placeholder="Interpretul melodiei" name="interpret" required>
    <label for="versuri"><strong>Versuri</strong></label>
    <input type="text" id="versuri" placeholder="Autor versuri" name="versuri" required>
    <label for="muzica"><strong>Muzica</strong></label>
    <input type="text" id="muzica" placeholder="Autor muzica" name="muzica" required>
    <button type="submit" class="btn">Adauga</button>
    <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
  </form>
</div>

<div class="formPopup" id="modifica">
  <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
    <h2>Modifica melodie</h2>
    <label for="titluM"><strong>Titlu</strong></label>
    <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>
    <label for="interpretM"><strong>Interpret</strong></label>
    <input type="text" id="interpretM" placeholder="Interpretul melodiei" name="interpretM" required>
    <label for="versuriM"><strong>Versuri</strong></label>
    <input type="text" id="versuriM" placeholder="Autor versuri" name="versuriM" required>
    <label for="muzicaM"><strong>Muzica</strong></label>
    <input type="text" id="muzicaM" placeholder="Autor muzica" name="muzicaM" required>
    <button type="submit" class="btn">Modifica</button>
    <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
  </form>
</div>

<script>
const melodii2Show = [];
let fileContent;
let row = 0;
let nr;

async function getAJAX(file) {
  let myObject = await fetch(file);
  fileContent = await myObject.text();
}

function afiseazaTabel() {
  document.getElementById("tm").innerHTML = "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan=2 style='text-align:center'>Operatii</th></tr>";
  for (i = 0; i < melodii2Show.length; i++) {
    var m_curenta = new melodie(melodii2Show[i].titlu, melodii2Show[i].muzica, melodii2Show[i].versuri, melodii2Show[i].interpretare);
    document.getElementById("tm").innerHTML += m_curenta.randNou() + "<td><button onclick='openForm(" + i + ")'>Modificare</button></td><td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
  }
}

function loadTable() {
  document.getElementById("raw").innerHTML = fileContent;
  var melodiiStored = JSON.parse(fileContent);
  melodii2Show.length = 0;
  for (i = 0; i < melodiiStored.length; i++) {
    melodii2Show.push(melodiiStored[i]);
  }
  afiseazaTabel();
}

function modificaMelodie() {
  var mMod = new melodie(titluM.value, muzicaM.value, versuriM.value, interpretM.value);
  melodii2Show.splice(nr, 1, mMod);
  var myJSON = JSON.stringify(melodii2Show);
  localStorage.setItem("melodiiArray", myJSON);
  titluM.value = "";
  interpretM.value = "";
  versuriM.value = "";
  muzicaM.value = "";
  closeForm("modifica");
  afiseazaTabel();
}

function stergeMelodie(nr) {
  melodii2Show.splice(nr, 1);
  var myJSON = JSON.stringify(melodii2Show);
  localStorage.setItem("melodiiArray", myJSON);
  afiseazaTabel();
}

function melodie(ti, mu, ve, i) {
  this.titlu = ti;
  this.muzica = mu;
  this.versuri = ve;
  this.interpretare = i;
  this.randNou = function() {
    return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare + "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
  }
}

function adaugaMelodie(frm) {
  var mNoua = new melodie(frm.titlu.value, frm.muzica.value, frm.versuri.value, frm.interpret.value);
  melodii2Show.push(mNoua);
  var myJSON = JSON.stringify(melodii2Show);
  localStorage.setItem("melodiiArray", myJSON);
  afiseazaTabel();
  frm.titlu.value = "";
  frm.interpret.value = "";
  frm.versuri.value = "";
  frm.muzica.value = "";
  closeForm("adauga");
}

function openFormA() {
  document.getElementById("adauga").style.display = "block";
}

function openForm(rand) {
  let frm = document.getElementById("modifica");
  frm.style.display = "block";
  nr = rand;
  titluM.value = melodii2Show[nr].titlu;
  interpretM.value = melodii2Show[nr].interpretare;
  versuriM.value = melodii2Show[nr].versuri;
  muzicaM.value = melodii2Show[nr].muzica;
}

function closeForm(opt) {
  document.getElementById(opt).style.display = "none";
}
</script>

<!--
Ex 

1. Ce este adaptat:
Titlul paginii, antetul h1 si capul de tabel (Titlu, Interpretata de, Versuri, Muzica).
Butoanele de incarcare apeleaza getAJAX('Melodii_JSON.txt') si loadTable().
Tabloul melodii2Show, constructorul melodie(ti, mu, ve, i) cu metoda randNou() si afisarea initiala a randurilor din loadTable().

2. Ce NU este adaptat:
Butonul "Adauga masina" si cele doua formulare (#adauga si #modifica) au ramas cu cheile din carsArray
In loadTable(), butonul de stergere de pe fiecare rand apeleaza inca stergeMasina().
Functiile stergeMasina, modificaMasina, adaugaMasina si openForm folosesc inca tabloul inexistent masini2Show,
  constructorul inexistent masina(), campurile marca/model/culoare

3. Erori in consola
Stergere: Uncaught ReferenceError: masini2Show is not defined (in stergeMasina).
Modificare: formularul se deschide gol si apare Uncaught ReferenceError: masini2Show is not defined (in openForm); 
  daca se apasa si submit in formular, apare aceeasi eroare in modificaMasina
Adaugare: formularul se deschide cu campurile de masini, iar la trimitere (submit) apare Uncaught ReferenceError: masina is not defined (in adaugaMasina)
-->
</body>
</html>
