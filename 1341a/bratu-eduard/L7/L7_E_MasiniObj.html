<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu folosirea de obiecte"</title>
	<script>
// "masina" JS
function loadMjs(){
var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
document.getElementById("mjs").innerHTML = 
"<ul>"+
"<li>Tip: " + mJS.tip +"</li>" +
"<li>Model: "  + mJS.model +"</li>" +
"<li>Culoare: "  + mJS.culoare + "</li>" +
"<li>An fabricatie: "  + mJS.anFab + "</li>" +
"</ul>";
}
// "masina" LS
function loadMls(){
	if(localStorage.masina){
		var masinaL = JSON.parse(localStorage.masina)}
	else{
		var tL = prompt("Tip");
		var mL = prompt("Model");
		var cL = prompt("Culoare:");
		var aL = prompt("An fabricatie:");
		var masinaL = {tip : tL, model : mL, culoare : cL, anFab : aL};
		localStorage.setItem("masina", JSON.stringify(masinaL));
	}
document.getElementById("mls").innerHTML = 
"<ul>"+
"<li>Tip: " + masinaL.tip +"</li>" +
"<li>Model: "  + masinaL.model +"</li>" +
"<li>Culoare: "  + masinaL.culoare + "</li>" +
"<li>An fabricatie: " + masinaL.anFab + "</li>" +
"</ul>";
}

function salveazaMls() {

	var tL = document.getElementById("tipL").value;
	var mL = document.getElementById("modelL").value;
	var cL = document.getElementById("culoareL").value;
	var afL = document.getElementById("anFabL").value;

    var mLS = {tip : tL, model : mL, culoare : cL, anFab : afL};

    localStorage.setItem("masina", JSON.stringify(mLS));

    loadMls();

    return false;
}


// "masina" SS
function loadMss(){

}
</script>
</head>
<body onload="loadMls()">
<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
<p>Masina JavaScript</p>
	<div id="mjs"></div>
	</div>

<div style="background-color:ForestGreen;color:white;font-size:200%">
	<p>Masina Local Storage</p>
		<form onsubmit="return salveazaMls()">
		<label for="tipL">Tip</label> <input id="tipL" required>
		<label for="modelL">Model</label> <input id="modelL" required>
		<label for="culoareL">Culoare</label> <input id="culoareL" required>
		<label for="an fabricatie">An de fabricatie</label> <input id="anFabL" required>
		<button type="submit">Salvează</button>
		</form>
		<div id="mls"></div>
</div>

<div style="background-color:SeaGreen;color:white;font-size:200%"  onclick="loadMss()">
	<p>Masina Session Storage</p>
	<div id="mss"></div>
	
	</div>

</body>
</html>
