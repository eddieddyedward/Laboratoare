<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu obiecte și sessionStorage</title>
    <script>
    // La încărcarea paginii afișăm mașinile din ambele depozite (dacă există)
    window.onload = function() {
        afiseazaMasina(localStorage, "mls_content");
        afiseazaMasina(sessionStorage, "mss_content");
    };

    // "masina" JS (neschimbat)
    function loadMjs(){
        var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
        document.getElementById("mjs").innerHTML = 
        "<ul>"+
        "<li>Tip: " + mJS.tip +"</li>" +
        "<li>Model: " + mJS.model +"</li>" +
        "<li>Culoare: " + mJS.culoare + "</li>" +
        "<li>An fabricatie: " + mJS.anFab + "</li>" +
        "</ul>";
    }

    // --- FUNCȚII GENERICE REUTILIZABILE (pentru ambele tipuri de storage) ---

    function salveazaMasina(storage, prefix) {
        var t = document.getElementById("tip_" + prefix).value;
        var m = document.getElementById("model_" + prefix).value;
        var c = document.getElementById("culoare_" + prefix).value;
        var a = document.getElementById("an_" + prefix).value;

        // Creăm obiectul cu mașina
        var masinaObj = { tip: t, model: m, culoare: c, anFab: a };

        // Salvăm ca JSON string sub cheia "masina" în storage-ul primit ca parametru
        storage.setItem("masina", JSON.stringify(masinaObj));

        // Reafișăm
        afiseazaMasina(storage, prefix + "_content");
        return false;
    }

    function stergeMasina(storage, prefix) {
        storage.removeItem("masina");
        document.getElementById("tip_" + prefix).value = "";
        document.getElementById("model_" + prefix).value = "";
        document.getElementById("culoare_" + prefix).value = "";
        document.getElementById("an_" + prefix).value = "";
        
        afiseazaMasina(storage, prefix + "_content");
    }

    function afiseazaMasina(storage, containerId) {
        var container = document.getElementById(containerId);
        var dateSalvate = storage.getItem("masina");
        
        if(dateSalvate){
            // Convertim șirul JSON înapoi în obiect cu JSON.parse
            var masinaObj = JSON.parse(dateSalvate);
            
            container.innerHTML = 
            "<ul>"+
            "<li>Tip: " + masinaObj.tip +"</li>" +
            "<li>Model: " + masinaObj.model +"</li>" +
            "<li>Culoare: " + masinaObj.culoare + "</li>" +
            "<li>An fabricatie: " + masinaObj.anFab + "</li>" +
            "</ul>";
        } else {
            container.innerHTML = "<p>Nicio mașină salvată</p>";
        }
    }
    </script>
</head>
<body>

    <!-- Masina JavaScript -->
    <div style="background-color:LimeGreen;color:white;font-size:150%; padding: 10px; margin-bottom: 10px;" onclick="loadMjs()">
        <p>Masina JavaScript</p>
        <div id="mjs"></div>
    </div>

    <!-- Masina Local Storage -->
    <div style="background-color:ForestGreen;color:white;font-size:150%; padding: 10px; margin-bottom: 10px;">
        <p>Masina Local Storage</p>
        
        <form onsubmit="return salveazaMasina(localStorage, 'ls');" style="color: black; background: white; padding: 10px; font-size: 60%;">
            <label for="tip_ls">Tip:</label><br>
            <input type="text" id="tip_ls" required><br><br>
            
            <label for="model_ls">Model:</label><br>
            <input type="text" id="model_ls" required><br><br>
            
            <label for="culoare_ls">Culoare:</label><br>
            <input type="text" id="culoare_ls" required><br><br>

            <label for="an_ls">An fabricație:</label><br>
            <input type="number" id="an_ls" required><br><br>
            
            <input type="submit" value="Salvează">
            <input type="button" value="Șterge" onclick="stergeMasina(localStorage, 'ls')">
        </form>

        <div id="ls_content" style="color: white; font-size: 70%; margin-top: 10px;"></div>
    </div>

    <!-- Masina Session Storage -->
    <div style="background-color:SeaGreen;color:white;font-size:150%; padding: 10px; margin-bottom: 10px;">
        <p>Masina Session Storage</p>
        
        <form onsubmit="return salveazaMasina(sessionStorage, 'ss');" style="color: black; background: white; padding: 10px; font-size: 60%;">
            <label for="tip_ss">Tip:</label><br>
            <input type="text" id="tip_ss" required><br><br>
            
            <label for="model_ss">Model:</label><br>
            <input type="text" id="model_ss" required><br><br>
            
            <label for="culoare_ss">Culoare:</label><br>
            <input type="text" id="culoare_ss" required><br><br>

            <label for="an_ss">An fabricație:</label><br>
            <input type="number" id="an_ss" required><br><br>
            
            <input type="submit" value="Salvează">
            <input type="button" value="Șterge" onclick="stergeMasina(sessionStorage, 'ss')">
        </form>

        <div id="ss_content" style="color: white; font-size: 70%; margin-top: 10px;"></div>
    </div>

</body>
</html>
