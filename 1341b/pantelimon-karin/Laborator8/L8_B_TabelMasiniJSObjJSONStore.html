<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Tabel masini - Obiect JSON cu Formular și Validare</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        form {
            background-color: #f2f2f2;
            padding: 15px;
            width: 300px;
            border: 1px solid #ccc;
        }
        input {
            margin-bottom: 10px;
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        #mesaj {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Masinile dorite (JSON Store)</h1>

    <form onsubmit="return adaugaMasina();">
        <label for="marca">Marcă:</label>
        <input type="text" id="marca">

        <label for="model">Model:</label>
        <input type="text" id="model">

        <label for="culoare">Culoare:</label>
        <input type="text" id="culoare">

        <label for="anFab">An fabricație:</label>
        <input type="number" id="anFab">

        <input type="submit" value="Adauga masina">
    </form>

    <p id="mesaj"></p>

    <table id="tm">
        <tr>
            <th>Marca</th>
            <th>Model</th>
            <th>Culoare</th>
            <th>An fabricație</th>
        </tr>
    </table>

    <script>
        var m1 = new masina("Opel", "Zafira", "gri", 2015);
        var m2 = new masina("Seat", "Ibiza", "roz", 2018);

        document.getElementById("tm").innerHTML += m1.randNou(); 
        document.getElementById("tm").innerHTML += m2.randNou(); 

        if(localStorage.masinaN) {
            var masinaJSON = localStorage.masinaN;
            var mNoua = JSON.parse(masinaJSON);

            document.getElementById("tm").innerHTML += mNoua.randNou; 
        }

        function masina(mk, md, cl, an) {
            this.marca = mk;
            this.model = md;
            this.culoare = cl;
            this.anFab = an;
            this.randNou = function() {
                return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
            };
        }


        function valideaza(marca, model, culoare, an) {
            if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
                return "Toate câmpurile (marcă, model, culoare) sunt obligatorii și nu pot fi goale!";
            }

            var anCurent = new Date().getFullYear();
            var anNumar = Number(an);

            if (isNaN(anNumar) || !Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
                return "Anul de fabricație trebuie să fie un număr întreg între 1900 și " + anCurent + "!";
            }

            return "";
        }

        function adaugaMasina() {
            var marca = document.getElementById("marca").value;
            var model = document.getElementById("model").value;
            var culoare = document.getElementById("culoare").value;
            var an = document.getElementById("anFab").value;

            var paragrafMesaj = document.getElementById("mesaj");
            var eroare = valideaza(marca, model, culoare, an);

            if (eroare !== "") {
                paragrafMesaj.innerHTML = eroare;
                return false; 
            }

            paragrafMesaj.innerHTML = "";

            var mNoua = new masina(marca, model, culoare, an);
            document.getElementById("tm").innerHTML += mNoua.randNou(); 

            mNoua.randNou = mNoua.randNou().toString();
            var myJSON = JSON.stringify(mNoua);

            localStorage.setItem("masinaN", myJSON);

            document.querySelector("form").reset();
            return false;
        }
    </script>

</body>
</html>

<!-- 
  Exercițiul 4:
  (a) Cheia masinaN conține un șir de caractere (JSON string) cu proprietățile obiectului mașină, inclusiv randNou salvat ca text HTML.
  (b) Fără conversia metodei în text cu toString(), JSON.stringify() nu ar putea serializa funcția randNou, deoarece JSON-ul nu stochează 
  cod executabil.
  (c) Deoarece randNou a fost salvat ca șir de caractere (string) în JSON, la parsare el devine o proprietate text simplă, nu o funcție, 
  deci nu se pun paranteze.
  (d) Apare tot o singură mașină (ultima adăugată), deoarece se folosește o singură cheie (masinaN) care este suprascrisă la fiecare 
  adăugare nouă, exact ca în L8_A.
-->
<!--
  Exercițiul 5: 
  Validarea datelor asigură integritatea informațiilor introduse prin formular, iar stocarea ca obiect JSON unic
  menține structura proprietăților mașinii într-o singură cheie (masinaN). 
-->
