<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  margin-top: 15px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
  margin-top: 10px;
}

.form-group {
  margin-bottom: 10px;
}

label {
  display: inline-block;
  width: 110px;
}
</style>
</head>
<body>

<h1>Masinile dorite</h1>

<!-- Formularul în loc de prompt -->
<div id="formular">
  <div class="form-group">
    <label for="inputMarca">Marca:</label>
    <input type="text" id="inputMarca">
  </div>
  <div class="form-group">
    <label for="inputModel">Model:</label>
    <input type="text" id="inputModel">
  </div>
  <div class="form-group">
    <label for="inputCuloare">Culoare:</label>
    <input type="text" id="inputCuloare">
  </div>
  <div class="form-group">
    <label for="inputAn">An fabricație:</label>
    <input type="number" id="inputAn">
  </div>
  
  <button onclick="adaugaMasina()">Adauga masina</button>
</div>

<!-- Paragraful pentru mesajul de eroare -->
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricație</th>
  </tr>
</table>

<script>
/* 
  - Ce aduce nou fișierul C față de B:
  1. Tabloul masini2Store: Permite stocarea mai multor obiecte (o colecție), spre deosebire de B unde se salva o singură mașină.
  2. Cheia carsArray: Înlocuiește cheia unică masinaN cu una dedicată unui șir/tablou JSON.
  3. Bucla de la încărcare (for): Parcurge elementele salvate anterior în localStorage, le afișează în tabel în ordinea adăugării și le reintroduce în tabloul curent.
*/

// Constructorul actualizat cu anul de fabricație
function masina(mk, md, cl, an){
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;
    this.randNou = function() {
        return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
    };
}

// Mașini predefinite
var m1 = new masina("Opel", "Zafira", "gri", 2010);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

// Tabloul în care se vor reține mașinile (inclusiv cele salvate)
const masini2Store = [];

// Încărcare din localStorage dacă există date sub cheia "carsArray"
if(localStorage.carsArray) {
    let arrayJSON = localStorage.carsArray;
    var masiniStored = JSON.parse(arrayJSON);
    
    for(var i = 0; i < masiniStored.length; i++) {
        // Reconstruim obiectul folosind constructorul pentru a ne asigura că metoda randNou funcționează corect
        var mStocata = new masina(masiniStored[i].marca, masiniStored[i].model, masiniStored[i].culoare, masiniStored[i].anFab);
        document.getElementById("tm").innerHTML += mStocata.randNou(); 
        masini2Store.push(mStocata);
    }
}

// Funcția de validare a câmpurilor
function valideaza(marca, model, culoare, an) {
    if (!marca || marca.trim() === "") return "Marca nu poate fi goală.";
    if (!model || model.trim() === "") return "Modelul nu poate fi gol.";
    if (!culoare || culoare.trim() === "") return "Culoarea nu poate fi goală.";

    var anCurent = new Date().getFullYear();
    var anNumar = Number(an);
    if (isNaN(anNumar) || !Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
        return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
    }
    return "";
}

function adaugaMasina() {
    var pMesaj = document.getElementById("mesaj");

    // Preluăm valorile din formular
    var marca = document.getElementById("inputMarca").value;
    var model = document.getElementById("inputModel").value;
    var culoare = document.getElementById("inputCuloare").value;
    var an = document.getElementById("inputAn").value;

    // Validăm datele
    var eroare = valideaza(marca, model, culoare, an);
    if (eroare !== "") {
        pMesaj.innerText = eroare; 
        return;
    }

    // Dacă datele sunt corecte, resetăm mesajul de eroare
    pMesaj.innerText = "";

    // Creăm obiectul nou
    var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
    document.getElementById("tm").innerHTML += mNoua.randNou(); 

    // Adăugăm în tablô și salvăm sub formă de JSON array în localStorage
    masini2Store.push(mNoua);
    var myJSON = JSON.stringify(masini2Store);
    localStorage.setItem("carsArray", myJSON);
}
</script>

</body>
</html>
