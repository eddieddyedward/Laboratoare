<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini - Stocare multiplă</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  margin-top: 15px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
  margin-top: 10px;
}

.form-group {
  margin-bottom: 10px;
}

label {
  display: inline-block;
  width: 110px;
}
</style>
</head>
<body>

<h1>Masinile dorite</h1>

<!-- Formularul -->
<div id="formular">
  <div class="form-group">
    <label for="inputMarca">Marca:</label>
    <input type="text" id="inputMarca">
  </div>
  <div class="form-group">
    <label for="inputModel">Model:</label>
    <input type="text" id="inputModel">
  </div>
  <div class="form-group">
    <label for="inputCuloare">Culoare:</label>
    <input type="text" id="inputCuloare">
  </div>
  <div class="form-group">
    <label for="inputAn">An fabricație:</label>
    <input type="number" id="inputAn">
  </div>
  
  <button onclick="adaugaMasina()">Adauga masina</button>
</div>

<!-- Paragraful pentru mesajul de eroare -->
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricație</th>
  </tr>
</table>

<script>
// Constructorul pentru obiectul mașină
function masina(mk, md, cl, an){
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;
    this.randNou = function() {
        return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
    };
}

// Funcție ajutătoare pentru a redesena complet tabelul pe baza listei curente
function reconstruiesteTabelul() {
    var tabel = document.getElementById("tm");
    tabel.innerHTML = `
      <tr>
        <th>Marca</th>
        <th>Model</th>
        <th>Culoare</th>
        <th>An fabricație</th>
      </tr>
    `;
    for (var i = 0; i < listaMasini.length; i++) {
        tabel.innerHTML += listaMasini[i].randNou();
    }
}

var listaMasini = [];

// Verificăm dacă avem date salvate în localStorage
if (localStorage.masiniStore) {
    try {
        var masiniJSON = localStorage.masiniStore;
        var arraySalvat = JSON.parse(masiniJSON);
        
        // Reconstruim obiectele din datele salvate
        for (var i = 0; i < arraySalvat.length; i++) {
            var mParcurs = arraySalvat[i];
            var mNoua = new masina(mParcurs.marca, mParcurs.model, mParcurs.culoare, mParcurs.anFab);
            listaMasini.push(mNoua);
        }
    } catch(e) {
        console.error("Eroare la parsarea JSON-ului:", e);
    }
} else {
    // Dacă nu există nimic în localStorage, setăm mașinile predefinite inițiale
    var m1 = new masina("Opel", "Zafira", "gri", 2010);
    var m2 = new masina("Seat", "Ibiza", "roz", 2018);
    
    listaMasini.push(m1);
    listaMasini.push(m2);

    // Salvăm starea inițială în localStorage
    localStorage.setItem("masiniStore", JSON.stringify(listaMasini));
}

// Afișăm tabelul la încărcarea paginii
reconstruiesteTabelul();

// Funcția de validare a câmpurilor
function valideaza(marca, model, culoare, an) {
    if (!marca || marca.trim() === "") {
        return "Marca nu poate fi goală sau formată doar din spații.";
    }
    if (!model || model.trim() === "") {
        return "Modelul nu poate fi gol sau format doar din spații.";
    }
    if (!culoare || culoare.trim() === "") {
        return "Culoarea nu poate fi goală sau formată doar din spații.";
    }

    var anCurent = new Date().getFullYear();
    var anNumar = Number(an);
    
    if (isNaN(anNumar) || !Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
        return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
    }

    return "";
}

function adaugaMasina() {
    var pMesaj = document.getElementById("mesaj");

    // Preluarea valorilor din inputuri
    var marca = document.getElementById("inputMarca").value;
    var model = document.getElementById("inputModel").value;
    var culoare = document.getElementById("inputCuloare").value;
    var an = document.getElementById("inputAn").value;

    // Validăm datele
    var mesajEroare = valideaza(marca, model, culoare, an);

    if (mesajEroare !== "") {
        pMesaj.innerText = mesajEroare;
        return;
    }

    // Dacă datele sunt corecte, ștergem mesajul de eroare
    pMesaj.innerText = "";

    // Creăm obiectul nou
    var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
    
    // Adăugăm mașina nouă în listă
    listaMasini.push(mNoua);

    // Dacă sunt mai mult de 2 mașini, o ștergem pe cea mai veche (prima din listă)
    if (listaMasini.length > 2) {
        listaMasini.shift();
    }

    // Actualizăm afișarea în tabel
    reconstruiesteTabelul();

    // Salvăm starea actualizată în localStorage
    localStorage.setItem("masiniStore", JSON.stringify(listaMasini));
}
</script>

<!-- 
  
  (a) Cheia din localStorage () conține un șir JSON reprezentând un array de obiecte 
      cu proprietățile: marca, model, culoare și anFab.
  (b) Metodele/funcțiile din obiecte sunt ignorate de JSON.stringify. Fără transformarea prealabilă 
      sau fără reconstruirea obiectului prin constructor la citire, proprietatea metodă s-ar pierde.
  (c) Fără paranteze se face referire la funcția în sine , iar cu paranteze () 
      se apelează funcția pentru a returna șirul HTML.
  (d) L8_B limitează numărul maxim la 2 mașini prin instrucțiunea `listaMasini.shift()`, 
      pe când L8_A păstrează toate mașinile adăugate fără a le șterge.
-->

</body>
</html>
