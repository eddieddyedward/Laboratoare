<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini - Date pure</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  margin-top: 15px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
  margin-top: 10px;
}

.m-btn {
  margin-top: 10px;
  margin-right: 5px;
}
</style>
</head>
<body>

<h1>Masinile dorite (L8_D)</h1>

<!-- Formularul pentru adăugare -->
<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<!-- Butonul de ștergere totală -->
<button class="m-btn" onclick="stergeTot()">Sterge toate</button>

<!-- Paragraful pentru mesaje de eroare -->
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
// 1. Constructorul obiectului masina (stochează doar datele pure)
function masina(mk, md, cl, an){
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;
}

// 2. Definirea metodei o singură dată pe prototype (așa cum cere indicația)
// Astfel, JSON.stringify o ignoră complet și salvează doar proprietățile.
masina.prototype.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
};

// Tabloul global pentru mașini
var masini2Store = [];

// Mașini predefinite
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

masini2Store.push(m1);
masini2Store.push(m2);

// Funcție pentru randarea completă a tabelului
function afiseazaTabel() {
    var tabelHTML = "<tr><th>Marca</th><th>Model</th><th>Culoare</th><th>An fabricatie</th></tr>";
    for (let i = 0; i < masini2Store.length; i++) {
        tabelHTML += masini2Store[i].randNou();
    }
    document.getElementById("tm").innerHTML = tabelHTML;
}

// 3. Încărcare din localStorage la pornire
if (localStorage.carsDataArray) {
    let arrayJSON = localStorage.carsDataArray;
    let masiniStored = JSON.parse(arrayJSON);
    
    // Goleștem array-ul inițial și punem ce e salvat curat din storage
    masini2Store = [];
    
    for (let i = 0; i < masiniStored.length; i++) {
        // Recreăm fiecare obiect folosind new masina(...) pentru a recăpăta metoda de pe prototype
        let mStored = new masina(masiniStored[i].marca, masiniStored[i].model, masiniStored[i].culoare, masiniStored[i].anFab);
        masini2Store.push(mStored);
    }
}

afiseazaTabel();

// Funcția de validare
function valideaza(marca, model, culoare, an) {
    if (!marca || marca.trim() === "") return "Marca nu poate fi goală.";
    if (!model || model.trim() === "") return "Modelul nu poate fi gol.";
    if (!culoare || culoare.trim() === "") return "Culoarea nu poate fi goală.";

    var anCurent = new Date().getFullYear();
    var anNumar = Number(an);
    if (isNaN(anNumar) || !Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
        return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
    }
    return "";
}

// Adăugare mașină nouă
function adaugaMasina() {
    var pMesaj = document.getElementById("mesaj");
    var marca = document.getElementById("marca").value;
    var model = document.getElementById("model").value;
    var culoare = document.getElementById("culoare").value;
    var an = document.getElementById("anFab").value;

    var eroare = valideaza(marca, model, culoare, an);
    if (eroare !== "") {
        pMesaj.innerText = eroare;
        return false;
    }

    pMesaj.innerText = "";

    var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
    masini2Store.push(mNoua);

    // Salvăm în localStorage DOAR datele pure (JSON.stringify ignoră metodele de pe prototype)
    localStorage.setItem("carsDataArray", JSON.stringify(masini2Store));

    afiseazaTabel();
    document.querySelector("form").reset();
    return false;
}

// 4. Funcția pentru butonul „Sterge toate”
function stergeTot() {
    localStorage.removeItem("carsDataArray");
    masini2Store = [];
    afiseazaTabel();
    document.getElementById("mesaj").innerText = "";
}
</script>

</body>
</html>
