<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  margin-top: 20px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

form {
  margin-bottom: 20px;
}

form label {
  margin-right: 10px;
}

form input {
  margin-right: 15px;
  padding: 4px;
}

#mesaj {
  color: red;
  font-weight: bold;
  margin-top: 10px;
}
</style>
</head>
<body>

<h1>Masinile dorite</h1>


<form onsubmit="return adaugaMasina();">
  <label>Marca: <input type="text" id="marca"></label>
  <label>Model: <input type="text" id="model"></label>
  <label>Culoare: <input type="text" id="culoare"></label>
  <label>An fabricatie: <input type="number" id="anFab"></label>
  <button type="submit">Adauga masina</button>
</form>


<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;                                   
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}


var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 


if (localStorage.marca) {
  var marca = localStorage.marca;
  var model = localStorage.model;
  var culoare = localStorage.culoare;
  var anFab = localStorage.anFab;

  var mNoua = new masina(marca, model, culoare, anFab);
  document.getElementById("tm").innerHTML += mNoua.randNou();
}

function valideaza(marca, model, culoare, an) {
  if (!marca || marca.trim() === "") {
    return "Marca nu poate fi goală sau formată doar din spații.";
  }
  if (!model || model.trim() === "") {
    return "Modelul nu poate fi gol sau format doar din spații.";
  }
  if (!culoare || culoare.trim() === "") {
    return "Culoarea nu poate fi goală sau formată doar din spații.";
  }

  var anInt = parseInt(an, 10);
  var anCurent = new Date().getFullYear();

  if (isNaN(anInt) || anInt < 1900 || anInt > anCurent) {
    return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
  }

  return ""; 
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;      
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var pMesaj = document.getElementById("mesaj");

  var eroare = valideaza(marca, model, culoare, an);

  if (eroare !== "") {
    pMesaj.textContent = eroare;
    return false; 
  }

  pMesaj.textContent = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  localStorage.setItem("marca", marca);
  localStorage.setItem("model", model);
  localStorage.setItem("culoare", culoare);
  localStorage.setItem("anFab", an);

  return false; 
}
</script>

</body>
</html>
