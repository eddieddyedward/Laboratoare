<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1 > Masinile dorite </h1>

<form id="formular" onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>

</table>

<script>
const masini2Store = [];
if(localStorage.carsArray) {
let arrayJSON = localStorage.carsArray;
var masiniStored = JSON.parse(arrayJSON);
for(var i = 0; i < masiniStored.length; i++){
document.getElementById("tm").innerHTML += masiniStored[i].randNou; // proprietate
masini2Store.push(masiniStored[i]);
}
}


function masina(mk, md, cl, an){
this.marca = mk;
this.model = md;
this.culoare = cl;
this.anFab = an;
this.randNou = function() {return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>"};
}

function valideaza(marca, model, culoare, an) {
var anCurent = new Date().getFullYear();
if (marca === "") return "Marca nu poate fi goala.";
if (model === "") return "Modelul nu poate fi gol.";
if (culoare === "") return "Culoarea nu poate fi goala.";
if (!Number.isInteger(an) || an < 1900 || an > anCurent) return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
return "";
}

function adaugaMasina() {
var marca = document.getElementById("marca").value.trim();
var model = document.getElementById("model").value.trim();
var culoare = document.getElementById("culoare").value.trim();
var an = Number(document.getElementById("anFab").value);

var eroare = valideaza(marca, model, culoare, an);
document.getElementById("mesaj").innerHTML = eroare;
if (eroare !== "") {
  return false;
}

var mNoua = new masina(marca, model, culoare, an);
document.getElementById("tm").innerHTML += mNoua.randNou();

mNoua.randNou = mNoua.randNou().toString();
masini2Store.push(mNoua);
var myJSON = JSON.stringify(masini2Store);
localStorage.setItem("carsArray", myJSON);

document.getElementById("formular").reset();
return false;
}
</script>
</body>
</html>
<!--
Exercitiul 6 - ce aduce nou fata de L8_B:

- Tabloul masini2Store: toate masinile adaugate sunt pastrate intr-un tablou (array) de obiecte, nu doar ultima.
  La fiecare adaugare, masina noua se pune la sfarsitul tabloului cu push.
- Cheia carsArray: in Local Storage se salveaza intregul tablou, ca text JSON, sub o singura cheie
  (JSON.stringify(masini2Store)). In L8_B se salva un singur obiect, care era suprascris la fiecare adaugare.
- Bucla de la incarcare: tabloul salvat este citit cu JSON.parse, iar cu un for se adauga in tabel randul fiecarei
  masini (proprietatea randNou, text) si fiecare masina se pune inapoi in masini2Store, ca adaugarile noi sa se
  faca in continuarea celor vechi, nu peste ele.

Rezultat: dupa reincarcare apar toate masinile adaugate, in ordinea adaugarii.
(Masinile Opel si Seat din cod nu mai exista in aceasta varianta.)
