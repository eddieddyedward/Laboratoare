<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1 > Masinile dorite </h1>

<form id="formular" onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>

</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou();
document.getElementById("tm").innerHTML += m2.randNou();

if(localStorage.masinaN) {
var masinaJSON = localStorage.masinaN;
var mNoua = JSON.parse(masinaJSON);

document.getElementById("tm").innerHTML += mNoua.randNou; // proprietate
}


function masina(mk, md, cl, an){
this.marca = mk;
this.model = md;
this.culoare = cl;
this.anFab = an;
this.randNou = function() {return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>"};
}

function valideaza(marca, model, culoare, an) {
var anCurent = new Date().getFullYear();
if (marca === "") return "Marca nu poate fi goala.";
if (model === "") return "Modelul nu poate fi gol.";
if (culoare === "") return "Culoarea nu poate fi goala.";
if (!Number.isInteger(an) || an < 1900 || an > anCurent) return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
return "";
}

function adaugaMasina() {
var marca = document.getElementById("marca").value.trim();
var model = document.getElementById("model").value.trim();
var culoare = document.getElementById("culoare").value.trim();
var an = Number(document.getElementById("anFab").value);

var eroare = valideaza(marca, model, culoare, an);
document.getElementById("mesaj").innerHTML = eroare;
if (eroare !== "") {
  return false;
}

var mNoua = new masina(marca, model, culoare, an);
document.getElementById("tm").innerHTML += mNoua.randNou();

mNoua.randNou = mNoua.randNou().toString();
var myJSON = JSON.stringify(mNoua);
localStorage.setItem("masinaN", myJSON);

document.getElementById("formular").reset();
return false;
}
</script>
</body>
</html>
<!--
Exercitiul 4 - raspunsuri (pentru forma din arhiva):

(a) Dupa adaugarea unei masini, cheia masinaN contine textul JSON al obiectului, de exemplu:
    {"marca":"Dacia","model":"Logan","culoare":"alb","randNou":"<tr><td>Dacia</td><td>Logan</td><td>alb</td></tr>"}
    Adica datele masinii plus randul de tabel gata construit, ca text.

(b) JSON.stringify omite functiile. Daca randNou ar ramane metoda, in JSON ar ajunge doar marca, model si culoare,
    iar la reincarcare obiectul citit cu JSON.parse nu ar avea randNou (mNoua.randNou ar fi undefined si in tabel
    s-ar scrie "undefined"). De aceea metoda este inlocuita, inainte de salvare, cu rezultatul ei (un text),
    care se salveaza ca o proprietate obisnuita.

(c) JSON.parse intoarce un obiect simplu, nu un obiect de tip masina, deci nu are metode. randNou este acum o
    proprietate de tip text, nu o functie, asa ca se foloseste fara paranteze. Cu paranteze ar aparea o eroare
    (randNou is not a function).

(d) Dupa reincarcare apare tot o singura masina adaugata (ultima), la fel ca in L8_A: cheia masinaN este
    suprascrisa la fiecare adaugare. Diferenta fata de L8_A este ca masina se pastreaza intr-o singura cheie,
    ca obiect JSON, nu in trei (patru) chei separate.
-->
