<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Tabel masini</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
    </style>
</head>
<body>

    <h1>Masinile dorite</h1>

    <form onsubmit="return adaugaMasina()">
        <input id="marca" placeholder="Marca">
        <input id="model" placeholder="Model">
        <input id="culoare" placeholder="Culoare">
        <input id="anFab" type="number" placeholder="An fabricatie">
        <button type="submit">Adauga masina</button>
    </form>

    <p id="mesaj"></p>

    <table id="tm">
        <tr>
            <th>Marca</th>
            <th>Model</th>
            <th>Culoare</th>
            <th>An fabricatie</th>
        </tr>
    </table>

    <script>
        const masini2Store = [];

        if (localStorage.carsArray) {
            var arrayJSON = localStorage.carsArray;
            var masiniStored = JSON.parse(arrayJSON);

            for (var i = 0; i < masiniStored.length; i++) {
                document.getElementById("tm").innerHTML += masiniStored[i].randNou;
                masini2Store.push(masiniStored[i]);
            }
        }

        function masina(mk, md, cl, an) {
            this.marca = mk;
            this.model = md;
            this.culoare = cl;
            this.anFab = an;

            this.randNou = function () {
                return "<tr><td>" + this.marca +
                    "</td><td>" + this.model +
                    "</td><td>" + this.culoare +
                    "</td><td>" + this.anFab +
                    "</td></tr>";
            };
        }

        function valideaza(marca, model, culoare, an) {
            if (marca.trim() == "" || model.trim() == "" || culoare.trim() == "") {
                return "Marca, modelul si culoarea nu pot fi goale.";
            }

            if (!Number.isInteger(an) || an < 1900 || an > new Date().getFullYear()) {
                return "Anul trebuie sa fie intreg, intre 1900 si anul curent.";
            }

            return "";
        }

        function adaugaMasina() {
            var marca = document.getElementById("marca").value;
            var model = document.getElementById("model").value;
            var culoare = document.getElementById("culoare").value;
            var an = Number(document.getElementById("anFab").value);

            var eroare = valideaza(marca, model, culoare, an);

            if (eroare != "") {
                document.getElementById("mesaj").innerHTML = eroare;
                return false;
            }

            document.getElementById("mesaj").innerHTML = "";

            var mNoua = new masina(marca, model, culoare, an);

            document.getElementById("tm").innerHTML += mNoua.randNou();

            mNoua.randNou = mNoua.randNou().toString();

            masini2Store.push(mNoua);

            var myJSON = JSON.stringify(masini2Store);

            localStorage.setItem("carsArray", myJSON);

            return false;
        }
    </script>

</body>
</html>
<!--
Exercitiul 6

Fata de L8_B, L8_C foloseste un tablou de masini numit masini2Store.

Cheia carsArray pastreaza masinile adaugate in format JSON.

La reincarcarea paginii, JSON.parse transforma textul intr-un tablou de obiecte.

Bucla for parcurge fiecare masina salvata si adauga randul corespunzator in tabel.

masini2Store.push() adauga masinile la sfarsitul tabloului..

Dupa reincarcare apar toate masinile adaugate in ordine.
-->
