<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1> Masinile dorite </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if(localStorage.masinaN) {
  var masinaJSON = localStorage.masinaN;
  var mNoua = JSON.parse(masinaJSON);

  document.getElementById("tm").innerHTML += mNoua.randNou; // proprietate 
}

function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() == "") {
    return "Marca nu poate fi goala sau formata doar din spatii.";
  }
  if (model.trim() == "") {
    return "Modelul nu poate fi gol sau format doar din spatii.";
  }
  if (culoare.trim() == "") {
    return "Culoarea nu poate fi goala sau formata doar din spatii.";
  }
  var anCurent = new Date().getFullYear();
  var anNum = Number(an);
  if (an.trim() == "" || !Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul fabricatiei trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare != "") {
    document.getElementById("mesaj").innerHTML = eroare;
    return false;
  }

  document.getElementById("mesaj").innerHTML = "";

  var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  var myJSON = JSON.stringify(mNoua);

  localStorage.setItem("masinaN", myJSON);

  return false;
}

//a) Variabila masinaN stochează sub formă de șir de caractere proprietățile obiectului mNoua: marca, model, culoare, anFab și randNou.

//b) JSON.stringify() nu salvează funcțiile. De aceea, randNou este apelată și transformată în text HTML, pentru a putea fi salvată în JSON.

//c) După reîncărcare, JSON.parse() transformă randNou într-un șir de caractere, nu într-o funcție. Astfel, apelarea ei cu () generează o eroare.

//d) După reîncărcare, apare doar ultima mașină adăugată, deoarece fiecare salvare suprascrie aceeași cheie masinaN din localStorage.

</script>
</body>
</html>
