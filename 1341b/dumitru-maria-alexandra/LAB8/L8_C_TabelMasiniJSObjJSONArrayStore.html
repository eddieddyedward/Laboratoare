<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1 > Masinile dorite </h1>

<p>
<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>
</p>
<script>
const masini2Store = [];

if(localStorage.carsArray) {
  let arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  for(i=0; i < masiniStored.length ; i++){
    document.getElementById("tm").innerHTML += masiniStored[i].randNou; // proprietate 
    masini2Store.push(masiniStored[i]);
  }
}

function masina(mk, md, cl, an){
  this.marca= mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>"
  }
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
    return "Marca, modelul si culoarea nu pot fi goale sau formate doar din spatii.";
  }
  
  var anCurent = new Date().getFullYear();
  var anNum = Number(an);
  if (!Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
  }
  
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  var paragrafMesaj = document.getElementById("mesaj");

  if (eroare !== "") {
    paragrafMesaj.innerHTML = eroare;
    return false;
  }

  paragrafMesaj.innerHTML = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML +=  mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  masini2Store.push(mNoua);
  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);

  return false;
}
</script>

<!--
Raspuns Exercitiul 6:
Fata de L8_B, abordarea din L8_C aduce urmatoarele diferente majore:
- Tabloul masini2Store: Ne permite sa pastram o lista (un array) cu toate obiectele masinilor adaugate in timpul sesiunii, nu doar o singura masina izolata.
- Cheia carsArray: In Local Storage nu se mai salveaza un singur obiect JSON, ci intregul array masini2Store transformat in sir de caractere (string). Astfel, datele nu se mai suprascriu la fiecare adaugare, ci se acumuleaza.
- Bucla de la incarcare: Atunci cand reincarcam pagina si citim carsArray, obtinem un array cu toate masinile salvate in trecut. Folosim un bloc "for" pentru a parcurge fiecare masina, a o afisa in tabel (randNou) si a o reinsera in tabloul masini2Store curent, asigurandu-ne ca nu pierdem istoricul la viitoarele salvari.
-->
</body>
</html>
